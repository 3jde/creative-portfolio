<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Work 02: Quantum Ripples</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
        .text-overlay { position: absolute; bottom: 20px; left: 20px; right: 20px; text-align: center; pointer-events: none; }
        .zh { font-size: 14px; margin-bottom: 5px; opacity: 0.8; }
        .en { font-size: 12px; font-style: italic; opacity: 0.5; }
    </style>
<script>
  window.addEventListener('click', () => {
    const audio = new Audio(Math.random() > 0.5 ? '../../assets/music/jing.mp3' : '../../assets/music/song.mp3');
    audio.loop = true;
    audio.play();
  }, { once: true });
</script>
<body>
    <div class="text-overlay">
        <div class="zh">涟漪是动作的余音。作品将每一次点击视为一次量子观测，在数字海洋中制造的每一波澜都在重塑系统拓扑结构。</div>
        <div class="en">Ripples are the echoes of action. Every click is a quantum observation, reshaping the topology of the digital ocean.</div>
    </div>
    <script>
        let ripples = [];
        function setup() {
            createCanvas(windowWidth, windowHeight);
            background(5);
        }
        function draw() {
            background(5, 5, 10, 10); // leave faint dark texture
            for(let r of ripples) {
                r.update();
                r.display();
            }
            ripples = ripples.filter(r => r.radius < width*1.5);
        }
        function mousePressed() {
            ripples.push(new Ripple(mouseX, mouseY));
        }
        class Ripple {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.speed = 3;
                this.c = color(random(100,255), random(100,255), 255);
            }
            update() {
                this.radius += this.speed;
                this.speed *= 0.99; // slows down
            }
            display() {
                noFill();
                stroke(this.c, map(this.radius, 0, width, 255, 0));
                strokeWeight(2);
                ellipse(this.x, this.y, this.radius * 2);
            }
        }
        function windowResized() { resizeCanvas(windowWidth, windowHeight); }
    </script>
</body>
</html>
