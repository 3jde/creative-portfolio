<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Impact: Generative Cubes</title>
    <style>body { margin: 0; padding: 0; overflow: hidden; background: #050505; }</style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script>
        function setup() { createCanvas(windowWidth, windowHeight, WEBGL); noStroke(); }
        function draw() {
            background(5, 5, 5);
            rotateX(frameCount * 0.01);
            rotateY(frameCount * 0.01);
            for(let i=0; i<10; i++) {
                push();
                rotateY(i * PI/5);
                fill(100 + i*15, 50, 255 - i*15);
                box(100 + sin(frameCount*0.05)*50);
                pop();
            }
        }
    </script>
</head>

</html>
