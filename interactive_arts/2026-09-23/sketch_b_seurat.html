<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sketch B: Innovative Interaction (Seurat's Dots)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>body { margin: 0; overflow: hidden; background: #eee; }</style>
</head>
<body>
<script>
    let dots = [];
    let spacing = 15;
    function setup() {
        createCanvas(windowWidth, windowHeight);
        for (let x = 0; x < width; x += spacing) {
            for (let y = 0; y < height; y += spacing) {
                dots.push({
                    baseX: x, baseY: y,
                    x: x, y: y,
                    col: color(random(50, 200), random(100, 220), random(150, 255))
                });
            }
        }
        noStroke();
    }
    function draw() {
        background(240);
        let m = createVector(mouseX, mouseY);
        for (let d of dots) {
            let pos = createVector(d.x, d.y);
            let target = createVector(d.baseX, d.baseY);
            let distToMouse = p5.Vector.dist(pos, m);
            
            if (distToMouse < 100) {
                let repel = p5.Vector.sub(pos, m);
                repel.normalize();
                repel.mult((100 - distToMouse) * 0.1);
                target.add(repel.mult(5));
            }
            
            d.x = lerp(d.x, target.x, 0.1);
            d.y = lerp(d.y, target.y, 0.1);
            
            fill(d.col);
            circle(d.x, d.y, spacing * 0.8);
        }
    }
    function windowResized() { resizeCanvas(windowWidth, windowHeight); }
</script>
</body>
</html>
