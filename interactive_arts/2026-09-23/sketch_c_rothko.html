<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sketch C: Artistic Color (Rothko's Field)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>body { margin: 0; overflow: hidden; background: #222; }</style>
</head>
<body>
<script>
    let colors = [];
    function setup() {
        createCanvas(windowWidth, windowHeight);
        noStroke();
        colors = [
            color(180, 40, 40, 10),
            color(200, 100, 30, 10),
            color(50, 50, 120, 10)
        ];
    }
    function draw() {
        background(30, 5); // slow fade
        let t = frameCount * 0.005;
        
        for (let i = 0; i < colors.length; i++) {
            fill(colors[i]);
            let x = width / 2 + sin(t + i) * 100;
            let y = height / 3 * (i + 0.5) + cos(t + i) * 50;
            let w = width * 0.7 + sin(t * 0.5 + i) * 200;
            let h = height * 0.4 + cos(t * 0.5 + i) * 100;
            rectMode(CENTER);
            rect(x, y, w, h, 50);
        }
    }
    function mousePressed() {
        colors = [
            color(random(255), random(100), random(100), 10),
            color(random(100), random(255), random(100), 10),
            color(random(100), random(100), random(255), 10)
        ];
    }
    function windowResized() { resizeCanvas(windowWidth, windowHeight); }
</script>
</body>
</html>
