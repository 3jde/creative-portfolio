<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sketch A: Clifford Attractor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>body { margin: 0; padding: 0; overflow: hidden; background: #050505; }</style>
</head>
<body>
  <script>
    let particles = [];
    let numParticles = 10000;
    let a = -1.4, b = 1.6, c = 1.0, d = 0.7;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      background(5);
      for(let i=0; i<numParticles; i++) {
        particles.push(createVector(random(-3, 3), random(-3, 3)));
      }
    }

    function draw() {
      // Fade out effect to show motion trails
      fill(5, 5, 5, 35);
      noStroke();
      rect(0, 0, width, height);
      
      translate(width / 2, height / 2);
      
      // evolve parameters slightly over time for animation
      let a_cur = a + sin(frameCount * 0.002) * 0.3;
      let b_cur = b + cos(frameCount * 0.002) * 0.3;
      
      let dt = 0.015; // Smooth particle speed
      let scaleFactor = min(width, height) / 4.5;
      
      for (let i = 0; i < numParticles; i++) {
        let p = particles[i];
        
        // Calculate vector flow (using Clifford map equations as velocity)
        let vx = sin(a_cur * p.y) + c * cos(a_cur * p.x);
        let vy = sin(b_cur * p.x) + d * cos(b_cur * p.y);
        
        p.x += vx * dt;
        p.y += vy * dt;
        
        let px = p.x * scaleFactor;
        let py = p.y * scaleFactor;
        
        // Map color to velocity to emphasize motion
        let vel = sqrt(vx*vx + vy*vy);
        let colR = map(vel, 0, 2, 50, 255);
        let colG = map(vx, -2, 2, 100, 255);
        let colB = map(vy, -2, 2, 150, 255);
        
        stroke(colR, colG, colB, 150);
        strokeWeight(1.5);
        point(px, py);
        
        // Recycle particles that drift too far out of bounds
        if (p.x < -4 || p.x > 4 || p.y < -4 || p.y > 4) {
          p.x = random(-3, 3);
          p.y = random(-3, 3);
        }
      }
    }
    
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      background(5);
    }
  </script>
</body>
</html>
