<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crowd - System 13</title>
  <style>
    body { margin: 0; background: #0a0a0c; color: #fff; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; }
    canvas { position: absolute; top: 0; left: 0; z-index: 1; }
    
    .grid {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2;
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
      padding: 5vw; box-sizing: border-box; pointer-events: none;
    }
    
    .top-left { grid-column: 1; grid-row: 1; }
    .top-right { grid-column: 2; grid-row: 1; text-align: right; }
    .bottom-left { grid-column: 1; grid-row: 2; display: flex; align-items: flex-end; }
    .bottom-right { grid-column: 2; grid-row: 2; }
    
    h1 { font-size: 11vw; font-weight: bold; margin: 0; line-height: 0.8; letter-spacing: -0.04em; }
    .number { font-size: 11vw; font-weight: normal; margin: 0; line-height: 0.8; color: #ccff00; }
    h2 { font-size: 1.2vw; font-weight: bold; letter-spacing: 0.1em; margin: 0 0 15px 0; }
    p { font-size: 0.9vw; max-width: 22vw; line-height: 1.6; color: #888; margin: 0; }
    
    @media (max-width: 768px) {
      h1 { font-size: 18vw; }
      .number { font-size: 18vw; }
      h2 { font-size: 3vw; }
      p { font-size: 2.5vw; max-width: 60vw; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
</head>
<body>
  <div class="grid">
    <div class="top-left">
      <h1>CROWD.</h1>
    </div>
    <div class="top-right">
      <div class="number">13</div>
    </div>
    <div class="bottom-left">
      <div>
        <h2>SWARM DYNAMICS</h2>
        <p>Experiment No. 13 explores the balance between attraction and repulsion across an unrestricted canvas. The typography remains strictly anchored to a grid system while the fluid network flows freely beneath it. Drag to gather, Space to pulse.</p>
      </div>
    </div>
  </div>
  <script src="draft3.js"></script>
</body>
</html>
