<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Maze V2.0 - WebGL Edition</title>
    <!-- p5.js libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <!-- Top Navigation Bar (Consistent with Site) -->
    <nav class="top-nav">
        <div class="nav-logo"><a href="../../index.html">ONE ZEN</a></div>
        <div class="nav-menu">
            <a href="../../generative.html">玩码奔腾</a>
            <a href="../../digital.html">Digital Art</a>
            <a href="../../playground.html" class="active">数字游乐场</a>
        </div>
    </nav>

    <!-- Game Area -->
    <div class="game-wrapper">
        <div id="game-container">
            <!-- UI Overlay: Name Input -->
            <div id="name-input-ui" class="overlay">
                <h1 class="cyber-title">CYBER MAZE V2.0</h1>
                <p>ENTER YOUR NAME:</p>
                <input type="text" id="player-name" placeholder="Agent_47" maxlength="10">
                <br>
                <button id="start-btn" class="cyber-btn">START [ENTER]</button>
            </div>

            <!-- UI Overlay: HUD -->
            <div id="hud" class="overlay hidden hud-corner">
                <p id="hud-player">Player: </p>
                <p id="hud-level">LEVEL: </p>
                <p id="hud-time">TIME: 0.00 s</p>
                <p id="hud-best" class="text-green">BEST: --</p>
                <p class="hint-text">Move Mouse to Tilt Platform</p>
            </div>

            <!-- Record Animation -->
            <div id="record-anim" class="overlay hidden center-anim">
                <h2 class="text-gold blink">NEW RECORD! MEOW! 🌺</h2>
            </div>

            <!-- UI Overlay: Victory -->
            <div id="win-ui" class="overlay hidden">
                <h1 class="text-gold">VICTORY! MEOW!</h1>
                <p id="win-msg" class="text-silver"></p>
                <p id="win-stats" class="text-green"></p>
                <div class="btn-group">
                    <button id="restart-btn" class="cyber-btn">PLAY AGAIN</button>
                    <button id="quit-btn" class="cyber-btn btn-danger">QUIT</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="sketch.js"></script>
<a href="../../playground.html" style="position:fixed;bottom:20px;right:20px;color:#ccff00;text-decoration:none;font-family:monospace;font-size:12px;border:1px solid #ccff00;padding:5px 10px;background:#000;z-index:9999;opacity:0.7;transition:opacity 0.3s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.7">[ RETURN ]</a>
</body>
</html>
