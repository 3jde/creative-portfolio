<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive: Structural Repulsion</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>body { margin: 0; overflow: hidden; background: #000; }</style>
</head>
<body>
    <script>
    let nodes = [];
    function setup() {
        createCanvas(windowWidth, windowHeight);
        for(let i=0; i<300; i++) nodes.push(new Node());
    }
    function draw() {
        background(0, 100);
        nodes.forEach(n => { n.update(); n.show(); });
        for(let i=0; i<nodes.length; i++) {
            for(let j=i+1; j<nodes.length; j++) {
                let d = dist(nodes[i].pos.x, nodes[i].pos.y, nodes[j].pos.x, nodes[j].pos.y);
                if(d < 100) {
                    stroke(0, 255, 204, map(d, 0, 100, 100, 0));
                    line(nodes[i].pos.x, nodes[i].pos.y, nodes[j].pos.x, nodes[j].pos.y);
                }
            }
        }
    }
    class Node {
        constructor() {
            this.pos = createVector(random(width), random(height));
            this.vel = p5.Vector.random2D().mult(0.5);
            this.acc = createVector();
        }
        update() {
            let mouse = createVector(mouseX, mouseY);
            let d = dist(this.pos.x, this.pos.y, mouse.x, mouse.y);
            if(d < 150) {
                let force = p5.Vector.sub(this.pos, mouse);
                force.setMag(map(d, 0, 150, 2, 0));
                this.acc.add(force);
            }
            this.vel.add(this.acc);
            this.vel.limit(2.5);
            this.pos.add(this.vel);
            this.acc.mult(0);
            this.vel.mult(0.98); // friction
            if(this.pos.x<0)this.pos.x=width; if(this.pos.x>width)this.pos.x=0;
            if(this.pos.y<0)this.pos.y=height; if(this.pos.y>height)this.pos.y=0;
        }
        show() {
            noStroke();
            fill(0, 255, 204, 200);
            circle(this.pos.x, this.pos.y, 4);
        }
    }
    </script>
<a href="https://onezgames.com/generative" style="position:fixed;bottom:20px;right:20px;color:#ccff00;text-decoration:none;font-family:monospace;font-size:12px;border:1px solid #ccff00;padding:5px 10px;background:#000;z-index:9999;opacity:0.7;transition:opacity 0.3s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.7">[ RETURN ]</a>
</body>
</html>
