<!DOCTYPE html>
<html>
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>body { margin: 0; padding: 0; overflow: hidden; background: #0F0F0F; }</style>
</head>
<body>
  <script>
    let lines = [];
    function setup() {
      createCanvas(windowWidth, windowHeight);
      for(let i=0; i<20; i++) {
        lines.push({y: random(height), speed: random(1, 5), weight: random(1, 10)});
      }
      noFill();
    }
    function draw() {
      background(15, 15, 15, 40);
      stroke(200, 200, 200, 100);
      for(let l of lines) {
        strokeWeight(l.weight);
        beginShape();
        for(let x=0; x<=width; x+=50) {
          let yOffset = noise(x * 0.01, l.y * 0.01, frameCount * 0.01) * 200 - 100;
          vertex(x, l.y + yOffset);
        }
        endShape();
        l.y += l.speed;
        if(l.y > height + 100) l.y = -100;
      }
    }
  </script>
</body>
</html>
