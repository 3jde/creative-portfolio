<!DOCTYPE html>
<html>
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>body { margin: 0; padding: 0; overflow: hidden; background: #000; }</style>
</head>
<body>
  <script>
    let boxes = [];
    function setup() {
      createCanvas(windowWidth, windowHeight, WEBGL);
      for(let i=0; i<50; i++) {
        boxes.push({
          x: random(-width/2, width/2),
          y: random(-height/2, height/2),
          z: random(-500, 500),
          s: random(20, 100),
          rx: random(TWO_PI), ry: random(TWO_PI)
        });
      }
    }
    function draw() {
      background(10);
      ambientLight(100);
      pointLight(0, 255, 255, mouseX - width/2, mouseY - height/2, 200);
      pointLight(255, 0, 255, -mouseX + width/2, -mouseY + height/2, -200);
      
      rotateY(frameCount * 0.005);
      rotateX(frameCount * 0.002);
      
      noStroke();
      specularMaterial(250);
      shininess(50);
      
      for(let b of boxes) {
        push();
        translate(b.x, b.y, b.z);
        rotateX(b.rx + frameCount * 0.01);
        rotateY(b.ry + frameCount * 0.01);
        box(b.s);
        pop();
      }
    }
  </script>
</body>
</html>
