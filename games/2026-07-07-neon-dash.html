<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEON DASH | ONE ZEN</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body, html { width: 100%; height: 100%; background-color: #050505; overflow: hidden; font-family: 'VT323', monospace; }
    
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    /* CRT Scanline Effect */
    .crt-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      z-index: 10;
    }
    
    .ui-layer {
      position: absolute;
      top: 20px;
      left: 20px;
      pointer-events: none;
      z-index: 20;
    }
    
    .back-btn {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #ccff00;
      text-decoration: none;
      font-size: 1.5rem;
      border: 1px solid #ccff00;
      padding: 5px 15px;
      z-index: 30;
      background: rgba(0,0,0,0.5);
      pointer-events: auto;
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: #ccff00;
      color: #000;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>
  <div class="crt-overlay"></div>
  <a href="../games.html" class="back-btn">&lt; BACK</a>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Resize handling
    let w, h;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      if(player) player.y = h - 100;
    }
    window.addEventListener('resize', resize);
    
    // Game State
    let state = 'START'; // START, PLAYING, GAMEOVER
    let lastTime = performance.now();
    let speedMultiplier = 1;
    let score = 0;
    let highScore = localStorage.getItem('neonDashHigh') || 0;
    let shakeTime = 0;
    
    // Entities
    let player = { x: 0, y: 0, size: 15, targetX: 0 };
    let obstacles = [];
    let gems = [];
    let particles = [];
    let texts = [];
    let obstacleTimer = 0;
    let gemTimer = 0;
    let bgY = 0;
    
    resize();
    player.x = w / 2;
    player.targetX = w / 2;
    
    function initGame() {
      state = 'PLAYING';
      score = 0;
      speedMultiplier = 1;
      obstacles = [];
      gems = [];
      particles = [];
      texts = [];
      player.x = w / 2;
      player.targetX = w / 2;
      player.y = h - 150;
      obstacleTimer = 1;
      gemTimer = 2;
      shakeTime = 0;
    }
    
    // Particle Class
    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 5 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = 0.02 + Math.random() * 0.03;
        this.color = color;
        this.size = Math.random() * 4 + 2;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
      }
      draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }
    }
    
    // Floating Text Class
    class FloatingText {
      constructor(x, y, text, color) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.life = 1.0;
      }
      update() {
        this.y -= 2;
        this.life -= 0.02;
      }
      draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.font = '24px VT323, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(this.text, this.x, this.y);
        ctx.globalAlpha = 1.0;
      }
    }
    
    function spawnParticles(x, y, color, count) {
      for(let i=0; i<count; i++) particles.push(new Particle(x, y, color));
    }
    
    // Input Handling
    function updatePointer(e) {
      let clientX;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
      } else if (e.clientX !== undefined) {
        clientX = e.clientX;
      }
      
      if (clientX !== undefined) {
        player.targetX = clientX;
      }
    }
    
    canvas.addEventListener('mousemove', updatePointer);
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      updatePointer(e);
    }, {passive: false});
    
    canvas.addEventListener('touchstart', (e) => {
      if (state !== 'PLAYING') initGame();
      updatePointer(e);
    }, {passive: false});
    
    canvas.addEventListener('mousedown', (e) => {
      if (state !== 'PLAYING') initGame();
      updatePointer(e);
    });
    
    function drawGrid(ctx, dt) {
      ctx.strokeStyle = 'rgba(204, 255, 0, 0.15)'; // --neon color
      ctx.lineWidth = 1;
      ctx.beginPath();
      
      // vertical lines
      for (let i = 0; i < w; i += 60) {
        ctx.moveTo(i, 0);
        ctx.lineTo(i, h);
      }
      
      // horizontal scrolling lines
      if(state === 'PLAYING') {
        bgY = (bgY + 150 * speedMultiplier * dt) % 60;
      }
      for (let i = -60; i < h; i += 60) {
        let y = i + bgY;
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
      }
      ctx.stroke();
    }
    
    // Main Game Loop
    function loop() {
      requestAnimationFrame(loop);
      
      let now = performance.now();
      let dt = (now - lastTime) / 1000;
      lastTime = now;
      if (dt > 0.1) dt = 0.1;
      
      // Clear Screen
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, w, h);
      
      ctx.save();
      
      // Screen Shake
      if (shakeTime > 0) {
        shakeTime -= dt;
        let mag = 15 * shakeTime;
        ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
      }
      
      drawGrid(ctx, dt);
      
      if (state === 'PLAYING') {
        speedMultiplier += dt * 0.05;
        score += dt * 10 * speedMultiplier;
        
        // Player smooth movement
        player.x += (player.targetX - player.x) * 12 * dt;
        if (player.x < player.size) player.x = player.size;
        if (player.x > w - player.size) player.x = w - player.size;
        
        // Spawn Obstacles
        obstacleTimer -= dt;
        if (obstacleTimer <= 0) {
          let ow = 40 + Math.random() * 60;
          obstacles.push({
            x: Math.random() * w,
            y: -50,
            w: ow,
            h: 20 + Math.random() * 20,
            speed: 250 + Math.random() * 150
          });
          obstacleTimer = (0.6 + Math.random() * 0.4) / speedMultiplier;
        }
        
        // Spawn Gems
        gemTimer -= dt;
        if (gemTimer <= 0) {
          gems.push({
            x: Math.random() * (w - 40) + 20,
            y: -30,
            size: 15,
            speed: 200
          });
          gemTimer = (1.5 + Math.random() * 2) / speedMultiplier;
        }
      }
      
      // Update & Draw Gems
      for (let i = gems.length - 1; i >= 0; i--) {
        let g = gems[i];
        if (state === 'PLAYING') g.y += g.speed * speedMultiplier * dt;
        
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ccff00';
        ctx.fillStyle = '#ccff00';
        ctx.beginPath();
        ctx.moveTo(g.x, g.y - g.size);
        ctx.lineTo(g.x + g.size, g.y);
        ctx.lineTo(g.x, g.y + g.size);
        ctx.lineTo(g.x - g.size, g.y);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Collision
        if (state === 'PLAYING') {
          let dist = Math.hypot(player.x - g.x, player.y - g.y);
          if (dist < player.size + g.size) {
            score += 100;
            spawnParticles(g.x, g.y, '#ccff00', 15);
            texts.push(new FloatingText(g.x, g.y, "+100", '#ccff00'));
            gems.splice(i, 1);
            continue;
          }
        }
        if (g.y > h + 50) gems.splice(i, 1);
      }
      
      // Update & Draw Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        if (state === 'PLAYING') obs.y += obs.speed * speedMultiplier * dt;
        
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ff00ff';
        ctx.fillStyle = '#ff00ff';
        ctx.fillRect(obs.x - obs.w/2, obs.y - obs.h/2, obs.w, obs.h);
        ctx.shadowBlur = 0;
        
        // Collision
        if (state === 'PLAYING') {
          let rX = obs.x - obs.w/2;
          let rY = obs.y - obs.h/2;
          let closestX = Math.max(rX, Math.min(player.x, rX + obs.w));
          let closestY = Math.max(rY, Math.min(player.y, rY + obs.h));
          let dist = Math.hypot(player.x - closestX, player.y - closestY);
          
          if (dist < player.size * 0.8) {
            state = 'GAMEOVER';
            shakeTime = 0.5;
            spawnParticles(player.x, player.y, '#00ffff', 40);
            spawnParticles(player.x, player.y, '#ff00ff', 40);
            
            if (score > highScore) {
              highScore = Math.floor(score);
              localStorage.setItem('neonDashHigh', highScore);
            }
          }
        }
        if (obs.y > h + 50) obstacles.splice(i, 1);
      }
      
      // Update & Draw Particles
      for(let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if(particles[i].life <= 0) particles.splice(i, 1);
      }
      
      // Draw Player
      if (state === 'PLAYING' || state === 'START') {
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#00ffff';
        ctx.fillStyle = '#00ffff';
        
        // Calculate tilt based on movement speed (delta X)
        let deltaX = player.targetX - player.x;
        let tilt = deltaX * 0.05; 
        
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(tilt * Math.PI / 180); // slight rotation
        
        ctx.beginPath();
        ctx.moveTo(0, -player.size * 1.5);
        ctx.lineTo(player.size, player.size);
        ctx.lineTo(-player.size, player.size);
        ctx.fill();
        
        // engine thrust particle
        if(Math.random() > 0.5) {
            particles.push(new Particle(player.x + (Math.random()-0.5)*10, player.y + player.size, '#00ffff'));
        }
        
        ctx.restore();
        ctx.shadowBlur = 0;
      }
      
      // Update & Draw Texts
      for(let i = texts.length - 1; i >= 0; i--) {
        texts[i].update();
        texts[i].draw(ctx);
        if(texts[i].life <= 0) texts.splice(i, 1);
      }
      
      ctx.restore(); // restore shake translation
      
      // UI Layer
      ctx.fillStyle = '#ccff00';
      ctx.font = '28px VT323, monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`SCORE: ${Math.floor(score)}`, 20, 40);
      ctx.textAlign = 'right';
      ctx.fillText(`HI: ${highScore}`, w - 20, 40);
      
      if (state === 'START') {
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = '64px VT323, monospace';
        ctx.fillText("NEON DASH", w/2, h/2 - 40);
        ctx.fillStyle = '#ccff00';
        ctx.font = '28px VT323, monospace';
        ctx.fillText("TAP OR DRAG TO START", w/2, h/2 + 20);
      } else if (state === 'GAMEOVER') {
        ctx.fillStyle = '#ff00ff';
        ctx.textAlign = 'center';
        ctx.font = '64px VT323, monospace';
        ctx.fillText("SYSTEM FAILURE", w/2, h/2 - 40);
        ctx.fillStyle = '#fff';
        ctx.font = '28px VT323, monospace';
        ctx.fillText(`FINAL SCORE: ${Math.floor(score)}`, w/2, h/2 + 10);
        ctx.fillStyle = '#ccff00';
        ctx.fillText("TAP TO RESTART", w/2, h/2 + 50);
      }
    }
    
    // Start Loop
    loop();
  </script>
</body>
</html>
