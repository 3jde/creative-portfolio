<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON ROTOR DROP | ONE ZEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        :root { --c1: #ff0055; --c2: #00ffff; --c3: #ccff00; --bg: #050505; --text: #ffffff; }
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Space Mono', monospace; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh;
        }
        
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            padding: 20px;
            justify-content: space-between;
        }

        .header {
            display: flex;
            justify-content: space-between;
            font-family: 'VT323', monospace;
            font-size: 2.5rem;
            text-shadow: 0 0 10px var(--c2);
            color: var(--c2);
            opacity: 0.9;
        }

        .score-display {
            color: var(--c3);
            text-shadow: 0 0 10px var(--c3);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5,5,5,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            transition: opacity 0.3s;
        }

        .hidden { opacity: 0; pointer-events: none; }

        h1 {
            font-family: 'VT323', monospace;
            font-size: 4rem;
            margin-bottom: 10px;
            text-align: center;
            color: var(--c2);
            text-shadow: 0 0 20px var(--c2);
            letter-spacing: 2px;
        }

        p.instructions {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 30px;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--c1);
            color: var(--c1);
            padding: 15px 40px;
            font-family: 'Space Mono', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255,0,85,0.4), inset 0 0 15px rgba(255,0,85,0.2);
            transition: all 0.1s;
        }

        .btn:active {
            background: var(--c1);
            color: #000;
            box-shadow: 0 0 30px var(--c1);
        }

        .back-link {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #555;
            text-decoration: none;
            font-size: 0.8rem;
            pointer-events: auto;
        }
        
        .back-link:hover { color: var(--c2); text-shadow: 0 0 8px var(--c2); }

        #finalScore {
            font-size: 2rem;
            color: var(--c3);
            text-shadow: 0 0 15px var(--c3);
            margin-bottom: 30px;
        }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="header">
            <div>ROTOR</div>
            <div class="score-display">000</div>
        </div>
        <a href="../games.html" class="back-link">< RETURN TO GAMES</a>
    </div>

    <div id="startScreen" class="overlay">
        <h1>NEON ROTOR</h1>
        <p class="instructions">Drops are falling to the core.<br><br>TAP ANYWHERE to rotate the core.<br>Match the colors to survive.</p>
        <button class="btn" id="startBtn">INITIATE</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <h1 style="color: var(--c1); text-shadow: 0 0 20px var(--c1);">SYSTEM FAILURE</h1>
        <div id="finalScore">SCORE: 0</div>
        <button class="btn" id="restartBtn">REBOOT</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiScore = document.querySelector('.score-display');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const finalScoreEl = document.getElementById('finalScore');

        let cw, ch, cx, cy;
        let scaleRatio = 1;

        function resize() {
            cw = canvas.width = window.innerWidth;
            ch = canvas.height = window.innerHeight;
            cx = cw / 2;
            cy = ch / 2;
            scaleRatio = Math.min(cw, ch) / 800; 
        }
        window.addEventListener('resize', resize);
        resize();

        // Game state
        let state = 'menu'; // menu, playing, gameover
        let score = 0;
        let time = 0;
        let shake = 0;
        
        const colors = ['#ff0055', '#00ffff', '#ccff00']; // Pink, Cyan, Lime
        
        // Rotor
        const rotorRadius = 60;
        let targetAngle = 0;
        let currentAngle = 0;
        const segmentAngle = (Math.PI * 2) / 3;

        // Entities
        let drops = [];
        let particles = [];
        let floatTexts = [];
        let spawnTimer = 0;
        let spawnInterval = 120; // frames
        let dropSpeed = 2;

        function resetGame() {
            score = 0;
            time = 0;
            shake = 0;
            targetAngle = 0;
            currentAngle = 0;
            drops = [];
            particles = [];
            floatTexts = [];
            spawnInterval = 120;
            dropSpeed = 2.5;
            uiScore.innerText = '000';
            state = 'playing';
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
        }

        startBtn.addEventListener('click', resetGame);
        restartBtn.addEventListener('click', resetGame);

        // Controls (Tap anywhere)
        function handleInput(e) {
            if (e.cancelable) e.preventDefault();
            if (state === 'playing') {
                targetAngle += segmentAngle;
                createRipple(e.clientX || (e.touches && e.touches[0].clientX) || cx, 
                             e.clientY || (e.touches && e.touches[0].clientY) || cy);
            }
        }
        window.addEventListener('mousedown', handleInput);
        window.addEventListener('touchstart', handleInput, {passive: false});

        function spawnDrop() {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.max(cw, ch) * 0.7;
            const colorIndex = Math.floor(Math.random() * 3);
            drops.push({
                x: cx + Math.cos(angle) * dist,
                y: cy + Math.sin(angle) * dist,
                angle: angle,
                colorIndex: colorIndex,
                color: colors[colorIndex],
                radius: 12
            });
        }

        function spawnParticles(x, y, color) {
            for(let i=0; i<15; i++) {
                const a = Math.random() * Math.PI * 2;
                const v = Math.random() * 4 + 2;
                particles.push({
                    x, y,
                    vx: Math.cos(a) * v,
                    vy: Math.sin(a) * v,
                    radius: Math.random() * 4 + 2,
                    life: 1,
                    color
                });
            }
        }

        function spawnFloatText(x, y, text, color) {
            floatTexts.push({ x, y, text, color, life: 1, vy: -1 });
        }

        function createRipple(x, y) {
            particles.push({
                x, y, vx: 0, vy: 0, radius: 0, life: 1, type: 'ripple', maxR: 50
            });
        }

        function update() {
            if (state !== 'playing') return;
            
            time++;
            currentAngle += (targetAngle - currentAngle) * 0.2;
            if (shake > 0) shake *= 0.8;
            if (shake < 0.5) shake = 0;

            // Difficulty progression
            if (time % 600 === 0) {
                spawnInterval = Math.max(30, spawnInterval - 10);
                dropSpeed += 0.2;
            }

            spawnTimer--;
            if (spawnTimer <= 0) {
                spawnDrop();
                spawnTimer = spawnInterval;
            }

            // Update drops
            for (let i = drops.length - 1; i >= 0; i--) {
                let d = drops[i];
                let dx = cx - d.x;
                let dy = cy - d.y;
                let dist = Math.hypot(dx, dy);
                
                // Move towards center
                d.x += (dx / dist) * dropSpeed * scaleRatio;
                d.y += (dy / dist) * dropSpeed * scaleRatio;
                
                let distNow = Math.hypot(cx - d.x, cy - d.y);

                if (distNow <= rotorRadius * scaleRatio + d.radius) {
                    // Collision check
                    // Drop approach angle relative to center
                    let approachAngle = Math.atan2(d.y - cy, d.x - cx);
                    if (approachAngle < 0) approachAngle += Math.PI * 2;
                    
                    // Normalize current rotor angle
                    let normRotorAngle = currentAngle % (Math.PI * 2);
                    if (normRotorAngle < 0) normRotorAngle += Math.PI * 2;

                    // Figure out which segment hit it
                    // The rotor is drawn with segments 0, 1, 2 starting from normRotorAngle
                    let relativeAngle = (approachAngle - normRotorAngle + Math.PI * 2) % (Math.PI * 2);
                    let hitSegment = Math.floor(relativeAngle / segmentAngle);

                    if (hitSegment === d.colorIndex) {
                        // Match!
                        score += 10;
                        uiScore.innerText = score.toString().padStart(3, '0');
                        spawnParticles(d.x, d.y, d.color);
                        spawnFloatText(d.x, d.y, "+10", d.color);
                        shake = 5;
                    } else {
                        // Mismatch! Game Over
                        state = 'gameover';
                        shake = 20;
                        finalScoreEl.innerText = 'SCORE: ' + score;
                        setTimeout(() => {
                            gameOverScreen.classList.remove('hidden');
                        }, 500);
                        spawnParticles(cx, cy, '#ffffff'); // explosion
                    }
                    drops.splice(i, 1);
                }
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if (p.type === 'ripple') {
                    p.radius += 2;
                    p.life -= 0.02;
                }
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Update float text
            for (let i = floatTexts.length - 1; i >= 0; i--) {
                let ft = floatTexts[i];
                ft.x += (Math.random() - 0.5);
                ft.y += ft.vy;
                ft.life -= 0.02;
                if (ft.life <= 0) floatTexts.splice(i, 1);
            }
        }

        function draw() {
            ctx.fillStyle = `rgba(5, 5, 5, ${state==='playing'?0.3:1})`; 
            ctx.fillRect(0, 0, cw, ch);

            ctx.save();
            if (shake > 0) {
                ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
            }

            // Draw rotor
            let rScale = rotorRadius * scaleRatio;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, rScale, currentAngle + i * segmentAngle, currentAngle + (i + 1) * segmentAngle);
                ctx.closePath();
                ctx.fillStyle = colors[i];
                // Glow
                ctx.shadowBlur = 15;
                ctx.shadowColor = colors[i];
                ctx.fill();
            }
            
            // Core inner circle
            ctx.beginPath();
            ctx.arc(cx, cy, rScale * 0.4, 0, Math.PI*2);
            ctx.fillStyle = '#111';
            ctx.shadowBlur = 0;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw drops
            for (let d of drops) {
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.radius * scaleRatio, 0, Math.PI*2);
                ctx.fillStyle = '#050505';
                ctx.fill();
                ctx.lineWidth = 4 * scaleRatio;
                ctx.strokeStyle = d.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = d.color;
                ctx.stroke();
            }

            // Draw particles
            for (let p of particles) {
                if (p.type === 'ripple') {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
                    ctx.strokeStyle = `rgba(255,255,255,${p.life * 0.5})`;
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 0;
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius * scaleRatio, 0, Math.PI*2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = p.color;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }

            // Draw float texts
            ctx.shadowBlur = 0;
            ctx.font = `bold ${20 * scaleRatio}px 'Space Mono'`;
            ctx.textAlign = 'center';
            for (let ft of floatTexts) {
                ctx.fillStyle = ft.color;
                ctx.globalAlpha = ft.life;
                ctx.fillText(ft.text, ft.x, ft.y);
            }
            ctx.globalAlpha = 1;

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
