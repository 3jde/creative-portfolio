<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEON DEFLECTOR | ONE ZEN</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --neon: #ccff00; --bg: #000000; --accent: #ff00cc; }
    body, html { width: 100%; height: 100%; background-color: var(--bg); color: var(--neon); font-family: 'Space Mono', monospace; overflow: hidden; touch-action: none; }
    #game-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; position: relative; }
    canvas { display: block; }
    
    .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; padding: 20px; z-index: 10; }
    .top-bar { display: flex; justify-content: space-between; font-size: 1.2rem; text-shadow: 0 0 5px var(--neon); }
    .back-btn { pointer-events: auto; color: var(--neon); text-decoration: none; border: 1px solid var(--neon); padding: 5px 10px; background: rgba(0,0,0,0.5); }
    .back-btn:hover { background: var(--neon); color: var(--bg); }
    
    #state-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; pointer-events: none; text-shadow: 0 0 10px var(--neon);
      background: rgba(0,0,0,0.8); padding: 40px; border: 2px dashed var(--neon);
    }
    #state-overlay h1 { font-family: 'VT323', monospace; font-size: clamp(3rem, 10vw, 6rem); margin-bottom: 10px; line-height: 1; }
    #state-overlay p { font-size: 1rem; margin-bottom: 20px; opacity: 0.8; }
    .blink { animation: blinker 1.5s linear infinite; }
    @keyframes blinker { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div id="game-container"></div>
  
  <div class="ui-overlay">
    <div class="top-bar">
      <a href="../games.html" class="back-btn">< BACK</a>
      <div id="score-display">SCORE: 0</div>
    </div>
  </div>

  <div id="state-overlay">
    <h1 id="main-title">NEON DEFLECTOR</h1>
    <p id="sub-title">SWIPE TO DRAW TETHERS. PROTECT THE CORE.</p>
    <div class="blink">[ TAP TO INITIATE ]</div>
  </div>

  <script>
    let state = 'START'; // START, PLAYING, GAME_OVER
    let score = 0;
    
    let core = { x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, r: 12, trails: [] };
    let target = { x: 0, y: 0, r: 18, active: false };
    
    let lines = [];
    let isDrawing = false;
    let currentLine = null;
    let maxLines = 4;
    
    let particles = [];
    let shakeAmount = 0;
    let hitSleep = 0;
    
    let gravity = 0.3;
    let baseGravity = 0.3;
    let maxSpeed = 18;

    const NEON = '#ccff00';
    const ACCENT = '#ff00cc';

    function setup() {
      let canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('game-container');
      resetGame();
      state = 'START';
    }

    function resetGame() {
      score = 0;
      gravity = baseGravity;
      core = { x: width/2, y: 100, px: width/2, py: 100, vx: 0, vy: 0, r: 12, trails: [] };
      lines = [];
      particles = [];
      shakeAmount = 0;
      hitSleep = 0;
      spawnTarget();
      updateDOM();
    }

    function spawnTarget() {
      target.x = random(50, width - 50);
      target.y = random(100, height * 0.7);
      target.active = true;
    }

    function updateDOM() {
      document.getElementById('score-display').innerText = `SCORE: ${score}`;
      let overlay = document.getElementById('state-overlay');
      if (state === 'PLAYING') {
        overlay.style.display = 'none';
      } else {
        overlay.style.display = 'block';
        if (state === 'START') {
          document.getElementById('main-title').innerText = 'NEON DEFLECTOR';
          document.getElementById('sub-title').innerText = 'SWIPE TO DRAW TETHERS. PROTECT THE CORE.';
        } else if (state === 'GAME_OVER') {
          document.getElementById('main-title').innerText = 'SYSTEM FAILURE';
          document.getElementById('sub-title').innerText = `FINAL SCORE: ${score}`;
        }
      }
    }

    function draw() {
      background(0, 40); // trailing effect on background

      if (hitSleep > 0) {
        hitSleep--;
        return;
      }

      push();
      if (shakeAmount > 0) {
        translate(random(-shakeAmount, shakeAmount), random(-shakeAmount, shakeAmount));
        shakeAmount *= 0.9;
        if (shakeAmount < 0.5) shakeAmount = 0;
      }

      if (state === 'PLAYING') {
        updateCore();
        checkTarget();
        updateLines();
      }
      
      updateParticles();
      
      drawTarget();
      drawLines();
      drawCore();
      drawParticles();
      
      pop();
    }

    function triggerShake(amt) {
      shakeAmount = max(shakeAmount, amt);
    }

    function spawnParticles(x, y, col, count = 15) {
      for (let i = 0; i < count; i++) {
        let angle = random(TWO_PI);
        let speed = random(2, 8);
        particles.push({
          x: x, y: y,
          vx: cos(angle) * speed, vy: sin(angle) * speed,
          life: 255, col: col,
          size: random(3, 8)
        });
      }
    }

    function updateCore() {
      core.px = core.x;
      core.py = core.y;
      
      core.vy += gravity;
      core.x += core.vx;
      core.y += core.vy;
      
      // Store trail
      core.trails.push({x: core.x, y: core.y});
      if (core.trails.length > 15) core.trails.shift();

      // Wall bounds
      if (core.x - core.r < 0) { core.x = core.r; core.vx *= -0.9; triggerShake(5); spawnParticles(core.x, core.y, NEON, 5); }
      if (core.x + core.r > width) { core.x = width - core.r; core.vx *= -0.9; triggerShake(5); spawnParticles(core.x, core.y, NEON, 5); }
      if (core.y - core.r < 0) { core.y = core.r; core.vy *= -0.9; triggerShake(5); spawnParticles(core.x, core.y, NEON, 5); }
      
      // Game Over
      if (core.y - core.r > height) {
        state = 'GAME_OVER';
        triggerShake(20);
        spawnParticles(core.x, height, ACCENT, 40);
        updateDOM();
        
        // Save High Score
        const currentPlayer = localStorage.getItem('o_zen_current_player');
        if (currentPlayer && score > 0) {
            let allScores = JSON.parse(localStorage.getItem('o_zen_game_scores') || '{}');
            if (!allScores['neon-deflector']) allScores['neon-deflector'] = {};
            allScores['neon-deflector'][currentPlayer] = Math.max((allScores['neon-deflector'][currentPlayer] || 0), score);
            localStorage.setItem('o_zen_game_scores', JSON.stringify(allScores));
        }
      }
    }

    function checkTarget() {
      if (!target.active) return;
      let d = dist(core.x, core.y, target.x, target.y);
      if (d < core.r + target.r) {
        target.active = false;
        score += 50;
        triggerShake(10);
        spawnParticles(target.x, target.y, ACCENT, 25);
        updateDOM();
        setTimeout(spawnTarget, 500);
        gravity = min(gravity + 0.02, 0.8);
      }
    }

    function updateLines() {
      for (let i = lines.length - 1; i >= 0; i--) {
        let l = lines[i];
        l.life -= 2;
        
        if (l.life <= 0) {
          lines.splice(i, 1);
          continue;
        }

        // Collision logic
        let hit = false;
        let dSq = distToSegmentSquared(core, {x: l.x1, y: l.y1}, {x: l.x2, y: l.y2});
        
        if (dSq < core.r * core.r) {
          hit = true;
        } else {
          let intersect = checkLineIntersection(core.px, core.py, core.x, core.y, l.x1, l.y1, l.x2, l.y2);
          if (intersect) hit = true;
        }

        if (hit) {
          let dx = l.x2 - l.x1;
          let dy = l.y2 - l.y1;
          let len = sqrt(dx*dx + dy*dy);
          let nx = -dy / len;
          let ny = dx / len;
          
          if (core.vx * nx + core.vy * ny > 0) { nx = -nx; ny = -ny; }
          
          let dot = core.vx * nx + core.vy * ny;
          let bounce = 1.3; 
          core.vx = (core.vx - 2 * dot * nx) * bounce;
          core.vy = (core.vy - 2 * dot * ny) * bounce;
          
          core.x += nx * core.r;
          core.y += ny * core.r;
          
          let speed = sqrt(core.vx*core.vx + core.vy*core.vy);
          if (speed > maxSpeed) {
            core.vx = (core.vx / speed) * maxSpeed;
            core.vy = (core.vy / speed) * maxSpeed;
          }
          
          triggerShake(8);
          spawnParticles(core.x, core.y, NEON, 10);
          hitSleep = 2;
          l.life = 0; 
          score += 5;
          updateDOM();
        }
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.vy += gravity * 0.5;
        p.life -= 5;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawCore() {
      noFill();
      stroke(NEON);
      strokeWeight(2);
      
      // Trail
      beginShape();
      for (let i = 0; i < core.trails.length; i++) {
        let pos = core.trails[i];
        stroke(204, 255, 0, map(i, 0, core.trails.length, 0, 255));
        vertex(pos.x, pos.y);
      }
      endShape();

      // Core
      fill(0);
      stroke(NEON);
      strokeWeight(3);
      circle(core.x, core.y, core.r * 2);
      
      // Inner dot
      fill(NEON);
      noStroke();
      circle(core.x, core.y, core.r * 0.5);
    }

    function drawTarget() {
      if (!target.active) return;
      noFill();
      stroke(ACCENT);
      strokeWeight(2);
      
      let pulse = map(sin(frameCount * 0.1), -1, 1, 0.8, 1.2);
      push();
      translate(target.x, target.y);
      rotate(frameCount * 0.05);
      rectMode(CENTER);
      rect(0, 0, target.r * 2 * pulse, target.r * 2 * pulse);
      rotate(PI/4);
      rect(0, 0, target.r * 2, target.r * 2);
      pop();
    }

    function drawLines() {
      strokeWeight(4);
      for (let l of lines) {
        stroke(204, 255, 0, l.life);
        line(l.x1, l.y1, l.x2, l.y2);
      }
      
      if (isDrawing && currentLine) {
        stroke(NEON);
        line(currentLine.x1, currentLine.y1, currentLine.x2, currentLine.y2);
      }
    }

    function drawParticles() {
      noStroke();
      for (let p of particles) {
        fill(p.col + hex(floor(p.life), 2)); // append alpha
        rectMode(CENTER);
        rect(p.x, p.y, p.size, p.size);
      }
    }

    // Input handling
    function handleStart(x, y) {
      if (state === 'START') { resetGame(); state = 'PLAYING'; updateDOM(); return; }
      if (state === 'GAME_OVER') { state = 'START'; updateDOM(); return; }
      if (state === 'PLAYING') {
        isDrawing = true;
        currentLine = { x1: x, y1: y, x2: x, y2: y };
      }
    }
    
    function handleMove(x, y) {
      if (isDrawing && currentLine) {
        currentLine.x2 = x; currentLine.y2 = y;
      }
    }
    
    function handleEnd() {
      if (isDrawing && currentLine) {
        let d = dist(currentLine.x1, currentLine.y1, currentLine.x2, currentLine.y2);
        if (d > 10) {
          lines.push({ x1: currentLine.x1, y1: currentLine.y1, x2: currentLine.x2, y2: currentLine.y2, life: 255 });
          if (lines.length > maxLines) lines.shift();
        }
      }
      isDrawing = false;
      currentLine = null;
    }

    function touchStarted() { handleStart(touches.length > 0 ? touches[0].x : mouseX, touches.length > 0 ? touches[0].y : mouseY); return false; }
    function touchMoved() { handleMove(touches.length > 0 ? touches[0].x : mouseX, touches.length > 0 ? touches[0].y : mouseY); return false; }
    function touchEnded() { handleEnd(); return false; }
    function mousePressed() { handleStart(mouseX, mouseY); return false; }
    function mouseDragged() { handleMove(mouseX, mouseY); return false; }
    function mouseReleased() { handleEnd(); return false; }

    function windowResized() { resizeCanvas(windowWidth, windowHeight); }

    // Math Utils
    function distSq(p1, p2) { return (p1.x - p2.x)**2 + (p1.y - p2.y)**2; }
    function distToSegmentSquared(p, v, w) {
      let l2 = distSq(v, w);
      if (l2 === 0) return distSq(p, v);
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      t = max(0, min(1, t));
      return distSq(p, { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) });
    }
    function checkLineIntersection(x1, y1, x2, y2, x3, y3, x4, y4) {
      let den = (y4 - y3)*(x2 - x1) - (x4 - x3)*(y2 - y1);
      if (den === 0) return null;
      let ua = ((x4 - x3)*(y1 - y3) - (y4 - y3)*(x1 - x3)) / den;
      let ub = ((x2 - x1)*(y1 - y3) - (y2 - y1)*(x1 - x3)) / den;
      if (ua > 0 && ua < 1 && ub > 0 && ub < 1) return { x: x1 + ua*(x2 - x1), y: y1 + ua*(y2 - y1) };
      return null;
    }
  </script>
</body>
</html>
