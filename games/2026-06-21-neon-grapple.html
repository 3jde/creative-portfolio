<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEON GRAPPLE | ONE ZEN</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --neon: #ccff00; --neon-alt: #00ffff; --bg: #050505; --danger: #ff003c; --node: #ffffff; }
    body { 
      background-color: var(--bg); 
      color: var(--neon); 
      font-family: 'Space Mono', monospace; 
      overflow: hidden; 
      touch-action: none;
      user-select: none;
    }
    #game-canvas { display: block; width: 100vw; height: 100vh; }
    
    .ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; padding: 20px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    
    .header { display: flex; justify-content: space-between; align-items: flex-start; }
    .nav a { color: var(--neon); text-decoration: none; border: 1px solid var(--neon); padding: 5px 10px; font-size: 0.8rem; pointer-events: auto; background: rgba(0,0,0,0.8); }
    .nav a:hover { background: var(--neon); color: var(--bg); }
    
    .stats { text-align: right; font-family: 'VT323', monospace; line-height: 1; }
    .score-board { font-size: 3rem; text-shadow: 0 0 10px var(--neon); }
    
    .instruction { text-align: center; font-size: 1.2rem; opacity: 0.8; margin-top: 20px; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    
    .game-over-screen {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; background: rgba(0,0,0,0.9); border: 2px solid var(--neon);
      padding: 40px; display: none; pointer-events: auto;
      box-shadow: 0 0 20px var(--neon);
    }
    .game-over-title { font-family: 'VT323', monospace; font-size: 4rem; margin-bottom: 20px; color: var(--danger); text-shadow: 0 0 10px var(--danger); }
    .final-score { font-size: 1.5rem; margin-bottom: 30px; }
    .btn {
      background: transparent; color: var(--neon); border: 1px solid var(--neon);
      padding: 10px 20px; font-family: 'Space Mono', monospace; font-size: 1rem;
      cursor: pointer; text-transform: uppercase; transition: all 0.2s;
    }
    .btn:hover { background: var(--neon); color: var(--bg); box-shadow: 0 0 15px var(--neon); }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div class="ui-layer">
    <div class="header">
      <div class="nav">
        <a href="../games.html">← BACK</a>
      </div>
      <div class="stats">
        <div class="score-board" id="score">0m</div>
      </div>
    </div>
    <div class="instruction" id="instruction">TAP & HOLD TO GRAPPLE</div>
    <div></div>
  </div>
  
  <div class="game-over-screen" id="game-over">
    <div class="game-over-title">SYSTEM FAILURE</div>
    <div class="final-score" id="final-score">DISTANCE: 0m</div>
    <button class="btn" id="restart-btn">REBOOT SEQUENCE</button>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const gameOverScreen = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart-btn');
    const instructionEl = document.getElementById('instruction');

    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game state
    let state = 'start'; // start, playing, gameover
    let score = 0;
    let cameraX = 0;
    let particles = [];
    
    // Entities
    let player = { x: 0, y: 0, vx: 0, vy: 0, radius: 12, trail: [] };
    let grapple = { active: false, node: null, length: 0 };
    let nodes = [];
    let wallX = 0;
    
    // Physics constants
    const gravity = 0.4;
    const terminalVelocity = 15;
    const baseSpeed = 6;
    let wallSpeed = 5.5;

    function initGame() {
      state = 'playing';
      score = 0;
      cameraX = 0;
      wallX = -width * 0.8;
      wallSpeed = 5.0; // starts slightly slower
      
      player = {
        x: 0,
        y: height * 0.4,
        vx: baseSpeed,
        vy: -5,
        radius: 12,
        trail: []
      };
      
      grapple = { active: false, node: null, length: 0 };
      nodes = [];
      particles = [];
      
      // Initial nodes
      for (let i = 0; i < 10; i++) {
        nodes.push({
          x: i * 200,
          y: height * 0.1 + Math.random() * (height * 0.3)
        });
      }
      
      gameOverScreen.style.display = 'none';
      instructionEl.style.display = 'block';
    }

    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          color
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawParticles(camX) {
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath();
        ctx.arc(p.x - camX, p.y, 3 * p.life, 0, Math.PI*2);
        ctx.fill();
      });
      ctx.globalAlpha = 1.0;
    }

    // Input handling
    let pointerDown = false;
    let pointerX = 0, pointerY = 0;
    
    function handlePointerDown(e) {
      if (state === 'gameover') return;
      if (state === 'start') initGame();
      
      pointerDown = true;
      if (e.touches) {
        pointerX = e.touches[0].clientX;
        pointerY = e.touches[0].clientY;
      } else {
        pointerX = e.clientX;
        pointerY = e.clientY;
      }
      
      // Find best node to grapple
      instructionEl.style.display = 'none';
      
      let bestNode = null;
      let minScore = Infinity;
      
      // Node must be ahead of player to be a good swing
      nodes.forEach(n => {
        if (n.x > player.x && n.x < player.x + width * 0.8) {
          let dx = n.x - player.x;
          let dy = n.y - player.y;
          let dist = Math.hypot(dx, dy);
          
          // score based on distance and angle
          let nodeScore = dist;
          if (nodeScore < minScore) {
            minScore = nodeScore;
            bestNode = n;
          }
        }
      });
      
      if (bestNode) {
        grapple.active = true;
        grapple.node = bestNode;
        grapple.length = Math.hypot(bestNode.x - player.x, bestNode.y - player.y);
        spawnParticles(bestNode.x, bestNode.y, '#ccff00', 10);
      }
    }
    
    function handlePointerUp() {
      if (grapple.active) {
        spawnParticles(player.x, player.y, '#00ffff', 15);
      }
      pointerDown = false;
      grapple.active = false;
      grapple.node = null;
    }

    window.addEventListener('mousedown', handlePointerDown);
    window.addEventListener('mouseup', handlePointerUp);
    window.addEventListener('touchstart', handlePointerDown, {passive: false});
    window.addEventListener('touchend', handlePointerUp, {passive: false});

    restartBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      initGame();
    });

    let lastTime = performance.now();
    
    function update() {
      if (state !== 'playing') return;
      
      // Update camera and nodes
      cameraX = player.x - width * 0.3;
      
      let maxNodeX = nodes.length > 0 ? nodes[nodes.length-1].x : player.x;
      if (maxNodeX < cameraX + width + 500) {
        nodes.push({
          x: maxNodeX + 150 + Math.random() * 200,
          y: height * 0.05 + Math.random() * (height * 0.4)
        });
      }
      // Clean up old nodes
      if (nodes[0] && nodes[0].x < cameraX - 200) {
        nodes.shift();
      }

      // Wall of death logic
      wallSpeed += 0.0005; // gradually increases
      wallX += wallSpeed;
      if (wallX > player.x - player.radius) {
        gameOver();
      }

      // Physics
      player.vy += gravity;
      
      // Air drag
      player.vx *= 0.995;
      player.vy *= 0.995;
      
      if (grapple.active && grapple.node) {
        // Position-based dynamics for pendulum
        player.x += player.vx;
        player.y += player.vy;
        
        let dx = player.x - grapple.node.x;
        let dy = player.y - grapple.node.y;
        let dist = Math.hypot(dx, dy);
        
        if (dist > grapple.length) {
          let nx = dx / dist;
          let ny = dy / dist;
          
          player.x = grapple.node.x + nx * grapple.length;
          player.y = grapple.node.y + ny * grapple.length;
          
          // Velocity projection
          let dot = player.vx * nx + player.vy * ny;
          player.vx -= dot * nx;
          player.vy -= dot * ny;
          
          // Boost forward momentum slightly when swinging
          if (player.vx > 0) {
            player.vx += 0.05;
          }
        }
      } else {
        player.x += player.vx;
        player.y += player.vy;
        // Natural forward acceleration if too slow
        if (player.vx < baseSpeed) {
          player.vx += 0.1;
        }
      }

      // Bounds checking (Floor and Ceiling)
      if (player.y > height - 40) {
        gameOver(); // Hit the hazard floor
      }
      if (player.y < 0) {
        player.y = 0;
        if (player.vy < 0) player.vy = 0;
      }
      
      // Trail
      player.trail.push({ x: player.x, y: player.y });
      if (player.trail.length > 20) player.trail.shift();
      
      // Update Score
      let currentDist = Math.floor(player.x / 50);
      if (currentDist > score) score = currentDist;
      scoreEl.innerText = score + 'm';

      updateParticles();
    }

    function gameOver() {
      state = 'gameover';
      spawnParticles(player.x, player.y, '#ff003c', 50);
      gameOverScreen.style.display = 'block';
      finalScoreEl.innerText = 'DISTANCE: ' + score + 'm';
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Grid background
      ctx.strokeStyle = 'rgba(204, 255, 0, 0.05)';
      ctx.lineWidth = 1;
      let gridOffset = -(cameraX % 50);
      ctx.beginPath();
      for (let x = gridOffset; x < width; x += 50) {
        ctx.moveTo(x, 0); ctx.lineTo(x, height);
      }
      for (let y = 0; y < height; y += 50) {
        ctx.moveTo(0, y); ctx.lineTo(width, y);
      }
      ctx.stroke();

      // Wall of death
      let screenWallX = wallX - cameraX;
      if (screenWallX > -100) {
        let grad = ctx.createLinearGradient(screenWallX, 0, screenWallX - 100, 0);
        grad.addColorStop(0, 'rgba(255, 0, 60, 0.8)');
        grad.addColorStop(1, 'rgba(255, 0, 60, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(screenWallX - 100, 0, 100, height);
        
        ctx.strokeStyle = '#ff003c';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(screenWallX, 0);
        ctx.lineTo(screenWallX, height);
        ctx.stroke();
        
        // Laser sparks
        for (let i = 0; i < 5; i++) {
          ctx.fillStyle = '#ff003c';
          ctx.fillRect(screenWallX - Math.random() * 20, Math.random() * height, Math.random() * 10 + 2, 2);
        }
      }

      // Nodes
      nodes.forEach(n => {
        let nx = n.x - cameraX;
        if (nx > -50 && nx < width + 50) {
          ctx.fillStyle = 'var(--node)';
          ctx.beginPath();
          ctx.arc(nx, n.y, 4, 0, Math.PI*2);
          ctx.fill();
          
          // Aura
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
          ctx.beginPath();
          ctx.arc(nx, n.y, 10, 0, Math.PI*2);
          ctx.stroke();
        }
      });

      // Hazard floor
      ctx.fillStyle = 'rgba(255, 0, 60, 0.1)';
      ctx.fillRect(0, height - 40, width, 40);
      ctx.strokeStyle = '#ff003c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 0; x < width; x += 20) {
        let spikeY = height - 40 + (Math.sin((x + cameraX) * 0.1) * 10);
        ctx.lineTo(x, spikeY);
      }
      ctx.stroke();

      if (state !== 'start') {
        // Grapple line
        if (grapple.active && grapple.node) {
          ctx.strokeStyle = 'var(--neon)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(player.x - cameraX, player.y);
          ctx.lineTo(grapple.node.x - cameraX, grapple.node.y);
          ctx.stroke();
        }

        // Trail
        if (player.trail.length > 0) {
          ctx.beginPath();
          ctx.moveTo(player.trail[0].x - cameraX, player.trail[0].y);
          for (let i = 1; i < player.trail.length; i++) {
            ctx.lineTo(player.trail[i].x - cameraX, player.trail[i].y);
          }
          ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
          ctx.lineWidth = player.radius;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.stroke();
        }

        // Player
        if (state !== 'gameover') {
          ctx.fillStyle = 'var(--neon-alt)';
          ctx.beginPath();
          ctx.arc(player.x - cameraX, player.y, player.radius, 0, Math.PI*2);
          ctx.fill();
          ctx.shadowBlur = 15;
          ctx.shadowColor = 'var(--neon-alt)';
          ctx.fill();
          ctx.shadowBlur = 0;
        }
        
        drawParticles(cameraX);
      } else {
        // Start screen idle drawing
        ctx.fillStyle = 'var(--neon)';
        ctx.font = '2rem "VT323"';
        ctx.textAlign = 'center';
        ctx.fillText("READY?", width/2, height/2);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    
    // Set initial nodes for start screen
    for (let i = 0; i < 20; i++) {
      nodes.push({
        x: i * 150,
        y: height * 0.1 + Math.random() * (height * 0.4)
      });
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
