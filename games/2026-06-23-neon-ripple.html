<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON RIPPLE</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #050510;
        color: #fff;
        font-family: 'Courier New', Courier, monospace;
        overflow: hidden;
        touch-action: none; /* Prevent default touch actions like scroll/zoom */
        user-select: none;
    }
    #gameCanvas {
        display: block;
        width: 100vw;
        height: 100vh;
    }
    #uiLayer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    .header {
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        text-shadow: 0 0 10px #0ff;
    }
    .stats {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }
    .score {
        font-size: 28px;
        font-weight: bold;
        color: #0ff;
    }
    .energy-container {
        width: 150px;
        height: 10px;
        border: 1px solid #0ff;
        border-radius: 5px;
        overflow: hidden;
        box-shadow: 0 0 5px #0ff;
    }
    .energy-bar {
        height: 100%;
        width: 100%;
        background-color: #0ff;
        box-shadow: 0 0 10px #0ff;
        transition: width 0.1s linear;
    }
    .title {
        font-size: 20px;
        color: #fff;
        opacity: 0.7;
        text-align: right;
    }
    .lives {
        color: #ff0055;
        font-size: 24px;
        text-shadow: 0 0 10px #ff0055;
    }
    #gameOverScreen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(5, 5, 16, 0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s;
        backdrop-filter: blur(5px);
    }
    #gameOverScreen.active {
        opacity: 1;
        pointer-events: auto;
    }
    .go-title {
        font-size: 48px;
        color: #ff0055;
        text-shadow: 0 0 20px #ff0055;
        margin-bottom: 10px;
        font-weight: bold;
    }
    .go-score {
        font-size: 24px;
        color: #0ff;
        margin-bottom: 30px;
        text-shadow: 0 0 10px #0ff;
    }
    .btn {
        padding: 15px 40px;
        font-size: 20px;
        background: transparent;
        color: #fff;
        border: 2px solid #0ff;
        border-radius: 30px;
        cursor: pointer;
        font-family: inherit;
        text-shadow: 0 0 5px #0ff;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.1);
        transition: all 0.2s;
        pointer-events: auto;
    }
    .btn:hover, .btn:active {
        background: rgba(0, 255, 255, 0.2);
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.6), inset 0 0 15px rgba(0, 255, 255, 0.3);
    }
    .instruction {
        position: absolute;
        bottom: 40px;
        width: 100%;
        text-align: center;
        color: rgba(255,255,255,0.5);
        font-size: 16px;
        pointer-events: none;
        animation: pulseText 2s infinite;
    }
    @keyframes pulseText {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
    }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="uiLayer">
    <div class="header">
        <div class="stats">
            <div class="score" id="scoreDisplay">SCORE: 0</div>
            <div class="energy-container">
                <div class="energy-bar" id="energyBar"></div>
            </div>
            <div class="lives" id="livesDisplay">♥♥♥</div>
        </div>
        <div class="title">NEON<br>RIPPLE</div>
    </div>
    <div class="instruction" id="instructionText">TAP ANYWHERE TO CREATE A RIPPLE</div>
</div>

<div id="gameOverScreen">
    <div class="go-title">SYSTEM FAILURE</div>
    <div class="go-score" id="finalScoreDisplay">FINAL SCORE: 0</div>
    <button class="btn" id="restartBtn">REBOOT SEQUENCE</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const livesDisplay = document.getElementById('livesDisplay');
    const energyBar = document.getElementById('energyBar');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreDisplay = document.getElementById('finalScoreDisplay');
    const restartBtn = document.getElementById('restartBtn');
    const instructionText = document.getElementById('instructionText');

    let width, height;
    let score = 0;
    let lives = 3;
    let energy = 100;
    const MAX_ENERGY = 100;
    const ENERGY_COST = 20;
    const ENERGY_REGEN = 15; // per second
    
    let isGameOver = false;
    let frameCount = 0;
    let lastTime = 0;

    let enemies = [];
    let ripples = [];
    let particles = [];
    let popups = [];

    // Screen shake
    let shakeAmount = 0;

    // Difficulty
    let spawnRate = 60; // frames
    let enemySpeedMultiplier = 1;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    class Enemy {
        constructor() {
            this.radius = Math.random() * 8 + 8;
            this.x = Math.random() * (width - this.radius * 2) + this.radius;
            this.y = -this.radius;
            this.vx = (Math.random() - 0.5) * 1.5;
            this.vy = (Math.random() * 2 + 1.5) * enemySpeedMultiplier;
            
            const hues = [330, 15, 45]; // Pink, Red-Orange, Yellow-Orange
            this.hue = hues[Math.floor(Math.random() * hues.length)];
            this.color = `hsl(${this.hue}, 100%, 60%)`;
            this.vertices = Math.floor(Math.random() * 3) + 3; // 3 to 5 sides
            this.angle = Math.random() * Math.PI * 2;
            this.spin = (Math.random() - 0.5) * 0.1;
        }

        update(dt) {
            this.x += this.vx;
            this.y += this.vy;
            this.angle += this.spin;

            // Bounce off side walls
            if (this.x < this.radius || this.x > width - this.radius) {
                this.vx *= -1;
                this.x = Math.max(this.radius, Math.min(this.x, width - this.radius));
            }
        }

        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.beginPath();
            for (let i = 0; i < this.vertices; i++) {
                const a = (i / this.vertices) * Math.PI * 2;
                const px = Math.cos(a) * this.radius;
                const py = Math.sin(a) * this.radius;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.color;
            ctx.fillStyle = `#110000`;
            ctx.fill();
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }
    }

    class Ripple {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 0;
            this.maxRadius = Math.min(width, height) * 0.25;
            this.expandSpeed = this.maxRadius * 3; // pixels per sec
            this.active = true;
            this.alpha = 1;
            this.comboCount = 0;
        }

        update(dt) {
            if (!this.active) return;
            
            this.radius += this.expandSpeed * dt;
            
            if (this.radius > this.maxRadius * 0.7) {
                this.alpha -= dt * 3;
            }
            
            if (this.alpha <= 0) {
                this.active = false;
            }
        }

        draw(ctx) {
            if (!this.active) return;
            ctx.save();
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#0ff';
            ctx.strokeStyle = `rgba(0, 255, 255, ${Math.max(0, this.alpha)})`;
            ctx.lineWidth = 4 + (this.alpha * 4);
            ctx.stroke();
            
            // Inner fill
            ctx.fillStyle = `rgba(0, 255, 255, ${Math.max(0, this.alpha * 0.15)})`;
            ctx.fill();
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 4 + 1;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.life = 1.0;
            this.decay = Math.random() * 1.5 + 1.0;
            this.color = color;
            this.size = Math.random() * 3 + 1;
        }

        update(dt) {
            this.x += this.vx;
            this.y += this.vy;
            this.vx *= 0.95; // friction
            this.vy *= 0.95;
            this.life -= this.decay * dt;
        }

        draw(ctx) {
            if (this.life <= 0) return;
            ctx.save();
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    class Popup {
        constructor(x, y, text, color) {
            this.x = x;
            this.y = y;
            this.text = text;
            this.color = color;
            this.life = 1.0;
            this.vy = -50; // pixels per sec
        }
        update(dt) {
            this.y += this.vy * dt;
            this.life -= dt * 1.2;
        }
        draw(ctx) {
            if (this.life <= 0) return;
            ctx.save();
            ctx.globalAlpha = this.life;
            ctx.font = "bold 20px 'Courier New'";
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.textAlign = "center";
            ctx.fillText(this.text, this.x, this.y);
            ctx.restore();
        }
    }

    function createExplosion(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function addShake(amount) {
        shakeAmount = Math.min(shakeAmount + amount, 20);
    }

    function updateLives() {
        let hearts = "";
        for(let i=0; i<3; i++) {
            if (i < lives) hearts += "♥";
            else hearts += "♡";
        }
        livesDisplay.innerText = hearts;
        if (lives <= 0) {
            endGame();
        }
    }

    function tap(x, y) {
        if (isGameOver) return;
        
        if (instructionText.style.display !== 'none') {
            instructionText.style.display = 'none';
        }

        if (energy >= ENERGY_COST) {
            energy -= ENERGY_COST;
            ripples.push(new Ripple(x, y));
        } else {
            // Not enough energy visual feedback
            energyBar.style.backgroundColor = '#ff0055';
            energyBar.style.boxShadow = '0 0 10px #ff0055';
            setTimeout(() => {
                energyBar.style.backgroundColor = '#0ff';
                energyBar.style.boxShadow = '0 0 10px #0ff';
            }, 150);
        }
    }

    canvas.addEventListener('pointerdown', (e) => {
        tap(e.clientX, e.clientY);
    });

    function endGame() {
        isGameOver = true;
        gameOverScreen.classList.add('active');
        finalScoreDisplay.innerText = `FINAL SCORE: ${score}`;
    }

    function resetGame() {
        score = 0;
        lives = 3;
        energy = MAX_ENERGY;
        enemies = [];
        ripples = [];
        particles = [];
        popups = [];
        frameCount = 0;
        enemySpeedMultiplier = 1;
        spawnRate = 60;
        isGameOver = false;
        gameOverScreen.classList.remove('active');
        scoreDisplay.innerText = `SCORE: 0`;
        updateLives();
        instructionText.style.display = 'block';
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }

    restartBtn.addEventListener('click', resetGame);

    function gameLoop(timestamp) {
        if (isGameOver) return;
        
        let dt = (timestamp - lastTime) / 1000;
        if (dt > 0.1) dt = 0.1; // Cap dt for lag
        lastTime = timestamp;

        // Clear screen with trail effect
        ctx.fillStyle = 'rgba(5, 5, 16, 0.3)';
        ctx.fillRect(0, 0, width, height);

        // Apply screen shake
        ctx.save();
        if (shakeAmount > 0) {
            const dx = (Math.random() - 0.5) * shakeAmount;
            const dy = (Math.random() - 0.5) * shakeAmount;
            ctx.translate(dx, dy);
            shakeAmount *= 0.9;
            if (shakeAmount < 0.5) shakeAmount = 0;
        }

        // Energy regen
        energy = Math.min(MAX_ENERGY, energy + ENERGY_REGEN * dt);
        energyBar.style.width = `${(energy / MAX_ENERGY) * 100}%`;

        // Difficulty progression
        frameCount++;
        if (frameCount % 600 === 0) { // every 10 seconds approx
            spawnRate = Math.max(15, spawnRate - 5);
            enemySpeedMultiplier += 0.1;
        }

        // Spawn enemies
        if (frameCount % Math.floor(spawnRate) === 0) {
            enemies.push(new Enemy());
        }

        // Update and draw Ripples
        for (let i = ripples.length - 1; i >= 0; i--) {
            let r = ripples[i];
            r.update(dt);
            r.draw(ctx);
            if (!r.active) {
                ripples.splice(i, 1);
            }
        }

        // Update and draw Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            e.update(dt);
            e.draw(ctx);

            // Check collision with bottom
            if (e.y > height + e.radius) {
                enemies.splice(i, 1);
                lives--;
                updateLives();
                addShake(10);
                document.body.style.backgroundColor = '#300';
                setTimeout(() => document.body.style.backgroundColor = '#050510', 100);
                continue;
            }

            // Check collision with ripples
            let destroyed = false;
            for (let r of ripples) {
                if (!r.active) continue;
                let dist = Math.hypot(e.x - r.x, e.y - r.y);
                // If enemy is inside the expanding rim
                if (dist < r.radius + e.radius && dist > r.radius - 20 - e.radius) {
                    destroyed = true;
                    r.comboCount++;
                    break;
                }
            }

            if (destroyed) {
                // Determine which ripple hit for combo
                let hittingRipple = ripples.find(r => r.active && Math.hypot(e.x - r.x, e.y - r.y) < r.radius + e.radius);
                let multiplier = hittingRipple ? hittingRipple.comboCount : 1;
                
                let points = 10 * multiplier;
                score += points;
                scoreDisplay.innerText = `SCORE: ${score}`;
                
                createExplosion(e.x, e.y, e.color, 15);
                popups.push(new Popup(e.x, e.y, `+${points}`, e.color));
                
                if (multiplier > 1) {
                    popups.push(new Popup(e.x, e.y - 20, `${multiplier}X COMBO!`, '#0ff'));
                    addShake(2 * multiplier);
                }

                enemies.splice(i, 1);
            }
        }

        // Update and draw Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.update(dt);
            p.draw(ctx);
            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }

        // Update and draw Popups
        for (let i = popups.length - 1; i >= 0; i--) {
            let p = popups[i];
            p.update(dt);
            p.draw(ctx);
            if (p.life <= 0) {
                popups.splice(i, 1);
            }
        }

        ctx.restore(); // restore shake translation

        requestAnimationFrame(gameLoop);
    }

    // Start game
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);

</script>
</body>
</html>
