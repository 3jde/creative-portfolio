<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON SLING | ONE ZEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        :root { --neon: #ccff00; --bg: #050505; --accent: #ff0055; --text: #ffffff; }
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Space Mono', monospace; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh;
        }
        
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            font-family: 'VT323', monospace;
            font-size: 2rem;
            text-shadow: 0 0 10px var(--neon);
            color: var(--neon);
            opacity: 0.8;
        }

        .timer {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent);
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-family: 'VT323', monospace;
            font-size: 4rem;
            color: var(--neon);
            text-shadow: 0 0 20px var(--neon);
            margin-bottom: 10px;
        }

        p.desc {
            font-size: 1rem;
            margin-bottom: 30px;
            color: #aaa;
            max-width: 400px;
            line-height: 1.5;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--neon);
            color: var(--neon);
            font-family: 'Space Mono', monospace;
            font-size: 1.2rem;
            padding: 15px 30px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(204, 255, 0, 0.2);
        }

        .btn:hover, .btn:active {
            background: var(--neon);
            color: var(--bg);
            box-shadow: 0 0 20px var(--neon);
        }

        .back-link {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #555;
            text-decoration: none;
            font-size: 0.9rem;
            pointer-events: auto;
        }
        .back-link:hover { color: var(--neon); }

        .hidden { display: none !important; }
        
        #score-display {
            font-family: 'VT323', monospace;
            font-size: 6rem;
            color: var(--neon);
            margin: 20px 0;
            text-shadow: 0 0 20px var(--neon);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="header">
            <div>SCORE: <span id="score">0</span></div>
            <div class="timer">TIME: <span id="time">10</span>s</div>
        </div>
        <a href="../games.html" class="back-link">< RETURN TO GAMES</a>
    </div>

    <div id="overlay">
        <h1 id="screen-title">NEON SLING</h1>
        <div id="final-score-container" class="hidden">
            <p>FINAL SCORE</p>
            <div id="score-display">0</div>
        </div>
        <p class="desc" id="screen-desc">Drag anywhere to aim and launch the core. Capture the red targets before time runs out. Each capture adds +3 seconds.</p>
        <button class="btn" id="start-btn">INITIATE LAUNCH</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        // UI Elements
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const screenTitle = document.getElementById('screen-title');
        const screenDesc = document.getElementById('screen-desc');
        const finalScoreContainer = document.getElementById('final-score-container');
        const scoreDisplay = document.getElementById('score-display');

        // Game State
        let width, height;
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let timeLeft = 10;
        let lastTime = 0;
        let screenShake = 0;

        // Entities
        let player = {
            x: 0, y: 0, vx: 0, vy: 0, radius: 12,
            color: '#ccff00', trail: []
        };

        let target = {
            x: 0, y: 0, size: 24, color: '#ff0055', active: false, scale: 0
        };

        let particles = [];

        // Input state
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let dragCurrent = { x: 0, y: 0 };

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if(gameState === 'START') {
                player.x = width / 2;
                player.y = height / 2;
            }
        }

        window.addEventListener('resize', resize);
        resize();

        // Audio Context (Synthesized sounds)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let actx;
        function initAudio() {
            if (!actx) actx = new AudioContext();
            if (actx.state === 'suspended') actx.resume();
        }

        function playSound(type) {
            if(!actx) return;
            const osc = actx.createOscillator();
            const gain = actx.createGain();
            osc.connect(gain);
            gain.connect(actx.destination);

            const now = actx.currentTime;
            if (type === 'launch') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'bounce') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 1);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 1);
                osc.start(now);
                osc.stop(now + 1);
            }
        }

        function spawnTarget() {
            let margin = 50;
            target.x = margin + Math.random() * (width - margin * 2);
            target.y = margin + Math.random() * (height - margin * 2);
            
            // Ensure target doesn't spawn too close to player
            let dx = target.x - player.x;
            let dy = target.y - player.y;
            if(Math.sqrt(dx*dx + dy*dy) < 100) {
                spawnTarget(); // retry
                return;
            }
            
            target.active = true;
            target.scale = 0;
        }

        function spawnParticles(x, y, color, count) {
            for(let i=0; i<count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 5 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    color: color,
                    size: Math.random() * 4 + 1
                });
            }
        }

        function startGame() {
            initAudio();
            gameState = 'PLAYING';
            score = 0;
            timeLeft = 10;
            player.x = width / 2;
            player.y = height / 2;
            player.vx = 0;
            player.vy = 0;
            player.trail = [];
            particles = [];
            scoreEl.innerText = score;
            timeEl.innerText = timeLeft.toFixed(1);
            overlay.classList.add('hidden');
            spawnTarget();
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            playSound('gameover');
            overlay.classList.remove('hidden');
            screenTitle.innerText = "SYSTEM FAILURE";
            screenDesc.classList.add('hidden');
            finalScoreContainer.classList.remove('hidden');
            scoreDisplay.innerText = score;
            startBtn.innerText = "REBOOT SYSTEM";
            
            // Save High Score
            const currentPlayer = localStorage.getItem('o_zen_current_player');
            if (currentPlayer && score > 0) {
                let allScores = JSON.parse(localStorage.getItem('o_zen_game_scores') || '{}');
                if (!allScores['neon-sling']) allScores['neon-sling'] = {};
                allScores['neon-sling'][currentPlayer] = Math.max((allScores['neon-sling'][currentPlayer] || 0), score);
                localStorage.setItem('o_zen_game_scores', JSON.stringify(allScores));
            }
        }

        // Input Handlers
        function handleStart(e) {
            if(gameState !== 'PLAYING') return;
            isDragging = true;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            dragStart.x = clientX;
            dragStart.y = clientY;
            dragCurrent.x = clientX;
            dragCurrent.y = clientY;
        }

        function handleMove(e) {
            if(!isDragging) return;
            e.preventDefault(); // prevent scroll
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            dragCurrent.x = clientX;
            dragCurrent.y = clientY;
        }

        function handleEnd(e) {
            if(!isDragging) return;
            isDragging = false;
            
            let dx = dragStart.x - dragCurrent.x;
            let dy = dragStart.y - dragCurrent.y;
            
            // Launch player
            let power = 0.15; // tuning
            let maxSpeed = 25;
            
            player.vx = Math.max(-maxSpeed, Math.min(maxSpeed, dx * power));
            player.vy = Math.max(-maxSpeed, Math.min(maxSpeed, dy * power));
            
            if(Math.abs(player.vx) > 1 || Math.abs(player.vy) > 1) {
                playSound('launch');
                spawnParticles(player.x, player.y, '#ffffff', 5);
            }
        }

        canvas.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove, {passive: false});
        window.addEventListener('mouseup', handleEnd);

        canvas.addEventListener('touchstart', handleStart, {passive: false});
        window.addEventListener('touchmove', handleMove, {passive: false});
        window.addEventListener('touchend', handleEnd);

        startBtn.addEventListener('click', startGame);

        function update(dt) {
            if(gameState !== 'PLAYING') return;

            // Timer
            timeLeft -= dt;
            if(timeLeft <= 0) {
                timeLeft = 0;
                gameOver();
            }
            timeEl.innerText = Math.ceil(timeLeft);

            // Physics
            player.x += player.vx;
            player.y += player.vy;

            // Friction / Drag
            player.vx *= 0.99;
            player.vy *= 0.99;

            // Bounce off walls
            let bounced = false;
            if(player.x - player.radius < 0) { player.x = player.radius; player.vx *= -0.8; bounced = true; }
            if(player.x + player.radius > width) { player.x = width - player.radius; player.vx *= -0.8; bounced = true; }
            if(player.y - player.radius < 0) { player.y = player.radius; player.vy *= -0.8; bounced = true; }
            if(player.y + player.radius > height) { player.y = height - player.radius; player.vy *= -0.8; bounced = true; }
            
            if(bounced && (Math.abs(player.vx) > 2 || Math.abs(player.vy) > 2)) {
                screenShake = 5;
                playSound('bounce');
                spawnParticles(player.x, player.y, player.color, 3);
            }

            // Trail
            if(Math.abs(player.vx) > 0.5 || Math.abs(player.vy) > 0.5) {
                player.trail.push({x: player.x, y: player.y, alpha: 1});
            }
            for(let i=0; i<player.trail.length; i++) {
                player.trail[i].alpha -= 0.05;
            }
            player.trail = player.trail.filter(t => t.alpha > 0);

            // Target collision
            if(target.active) {
                if(target.scale < 1) target.scale += 0.1;

                // Simple AABB / Circle collision
                let distX = Math.abs(player.x - target.x);
                let distY = Math.abs(player.y - target.y);
                
                if (distX <= (target.size/2 + player.radius) && distY <= (target.size/2 + player.radius)) {
                    // Hit
                    playSound('hit');
                    screenShake = 15;
                    spawnParticles(target.x, target.y, target.color, 20);
                    target.active = false;
                    score++;
                    timeLeft += 3; // +3 seconds
                    scoreEl.innerText = score;
                    scoreEl.style.transform = 'scale(1.5)';
                    setTimeout(() => scoreEl.style.transform = 'scale(1)', 100);
                    
                    setTimeout(spawnTarget, 200);
                }
            }

            // Particles
            for(let i=0; i<particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.95;
                p.vy *= 0.95;
                p.life -= 0.02;
            }
            particles = particles.filter(p => p.life > 0);
            
            if(screenShake > 0) screenShake *= 0.9;
        }

        function draw() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            if(screenShake > 0.5) {
                ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
            }

            // Draw grid (background aesthetic)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            let gridSize = 50;
            for(let x=0; x<width; x+=gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
            for(let y=0; y<height; y+=gridSize) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
            ctx.stroke();

            // Draw Target
            if(target.active) {
                ctx.save();
                ctx.translate(target.x, target.y);
                ctx.scale(target.scale, target.scale);
                ctx.fillStyle = target.color;
                ctx.shadowColor = target.color;
                ctx.shadowBlur = 15;
                ctx.fillRect(-target.size/2, -target.size/2, target.size, target.size);
                
                // Pulsing inner box
                ctx.strokeStyle = '#fff';
                ctx.shadowBlur = 0;
                let pulse = Math.sin(performance.now() * 0.01) * 2;
                ctx.strokeRect(-target.size/4 - pulse, -target.size/4 - pulse, target.size/2 + pulse*2, target.size/2 + pulse*2);
                ctx.restore();
            }

            // Draw Trail
            if(player.trail.length > 0) {
                ctx.beginPath();
                ctx.moveTo(player.trail[0].x, player.trail[0].y);
                for(let i=1; i<player.trail.length; i++) {
                    ctx.lineTo(player.trail[i].x, player.trail[i].y);
                }
                ctx.strokeStyle = player.color;
                ctx.lineWidth = player.radius * 0.8;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.globalAlpha = 0.3;
                ctx.stroke();
                ctx.globalAlpha = 1.0;
            }

            // Draw Player
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
            ctx.fillStyle = player.color;
            ctx.shadowColor = player.color;
            ctx.shadowBlur = 20;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw Trajectory preview
            if(isDragging) {
                let dx = dragStart.x - dragCurrent.x;
                let dy = dragStart.y - dragCurrent.y;
                let len = Math.sqrt(dx*dx + dy*dy);
                
                if(len > 10) {
                    ctx.beginPath();
                    ctx.moveTo(player.x, player.y);
                    let power = 0.15;
                    // Predict ~10 frames ahead loosely
                    let predX = player.x + (dx * power) * 10;
                    let predY = player.y + (dy * power) * 10;
                    
                    ctx.lineTo(predX, predY);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    
                    // Draw arrowhead
                    ctx.beginPath();
                    ctx.arc(predX, predY, 3, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.fill();
                }
            }

            // Draw Particles
            for(let i=0; i<particles.length; i++) {
                let p = particles[i];
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            ctx.restore();
        }

        function gameLoop(now) {
            let dt = (now - lastTime) / 1000;
            if(dt > 0.1) dt = 0.1; // clamp dt
            lastTime = now;

            update(dt);
            draw();

            if(gameState === 'PLAYING') {
                requestAnimationFrame(gameLoop);
            }
        }
        
        // Initial render
        draw();
    </script>
</body>
</html>
