<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Pulse - Daily Mini Game</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #050510; overflow: hidden; 
            font-family: 'Courier New', Courier, monospace; 
            touch-action: none; /* Prevent scroll on touch */
            user-select: none; -webkit-user-select: none; 
        }
        #gameCanvas { display: block; width: 100%; height: 100%; }
        #uiLayer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; display: flex; flex-direction: column; 
            justify-content: space-between; padding: 20px; box-sizing: border-box; 
        }
        .hud-top { 
            display: flex; justify-content: space-between; 
            color: #0ff; text-shadow: 0 0 10px #0ff; 
            font-size: 24px; font-weight: bold; 
        }
        .score-container { text-align: left; }
        .combo-container { text-align: right; color: #f0f; text-shadow: 0 0 10px #f0f; }
        
        #gameOverScreen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(5, 5, 16, 0.85); display: none; flex-direction: column; 
            align-items: center; justify-content: center; pointer-events: auto; 
        }
        #gameOverTitle { color: #f05; font-size: 48px; text-shadow: 0 0 20px #f05; margin-bottom: 20px; }
        #finalScore { color: #0ff; font-size: 32px; text-shadow: 0 0 10px #0ff; margin-bottom: 40px; }
        .btn { 
            background: transparent; border: 2px solid #0f0; color: #0f0; 
            padding: 15px 40px; font-size: 24px; text-shadow: 0 0 10px #0f0; 
            box-shadow: 0 0 15px #0f0 inset, 0 0 15px #0f0; 
            cursor: pointer; text-transform: uppercase; font-family: inherit; 
            font-weight: bold; transition: all 0.2s; border-radius: 8px;
        }
        .btn:active { background: #0f0; color: #000; box-shadow: 0 0 20px #0f0; }
        
        #instructions { 
            position: absolute; bottom: 80px; left: 0; width: 100%; 
            text-align: center; color: rgba(255, 255, 255, 0.7); 
            font-size: 18px; pointer-events: none; transition: opacity 0.5s; 
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        #backBtn {
            position: absolute; top: 20px; left: 20px;
            color: rgba(255, 255, 255, 0.5); font-size: 14px; text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.3); padding: 5px 10px;
            pointer-events: auto; z-index: 100;
        }
        #backBtn:hover { background: rgba(255, 255, 255, 0.1); }
        .hud-top { margin-top: 40px; } /* Space for back button */
    </style>
</head>
<body>
    <a id="backBtn" href="../games.html">&lt; BACK</a>
    <canvas id="gameCanvas"></canvas>
    <div id="uiLayer">
        <div class="hud-top">
            <div class="score-container">SCORE:<br><span id="scoreVal">0</span></div>
            <div class="combo-container">MAX COMBO:<br><span id="comboVal">0</span></div>
        </div>
        <div id="instructions">HOLD ANYWHERE TO CHARGE<br>RELEASE TO FIRE PULSE<br>(SURVIVE)</div>
    </div>
    <div id="gameOverScreen">
        <div id="gameOverTitle">SYSTEM FAILURE</div>
        <div id="finalScore">SCORE: 0</div>
        <button class="btn" id="restartBtn">REBOOT</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreVal');
        const comboEl = document.getElementById('comboVal');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreEl = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');
        const instructions = document.getElementById('instructions');

        let w, h, cx, cy;
        let lastTime = 0;
        
        let state = {
            score: 0,
            maxCombo: 0,
            isGameOver: false,
            charging: false,
            chargeRadius: 0,
            maxCharge: 200,
            chargeRate: 150, // pixels per sec
            enemies: [],
            particles: [],
            pulses: [],
            spawnTimer: 0,
            spawnRate: 1.2, // enemies per sec
            difficultyMulti: 1,
            timeAlive: 0,
            shake: 0,
            flash: 0,
            playerRadius: 15
        };

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            cx = w / 2;
            cy = h / 2;
            // Scale max charge based on screen size
            state.maxCharge = Math.min(w, h) * 0.45;
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio Context (Optional visual feedback covers it, but we can synthesize tiny beeps)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }
        function playTone(freq, type, duration, vol=0.1) {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // Input
        function startCharge(e) {
            if (e.target.id === 'backBtn') return;
            initAudio(); // Initialize on first interaction
            if (state.isGameOver) return;
            state.charging = true;
            instructions.style.opacity = '0';
        }
        
        function endCharge(e) {
            if (state.isGameOver || !state.charging) return;
            state.charging = false;
            firePulse();
        }

        window.addEventListener('pointerdown', startCharge);
        window.addEventListener('pointerup', endCharge);
        window.addEventListener('pointercancel', endCharge);
        
        restartBtn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            resetGame();
        });

        function resetGame() {
            state = {
                ...state,
                score: 0,
                isGameOver: false,
                charging: false,
                chargeRadius: 0,
                enemies: [],
                particles: [],
                pulses: [],
                spawnTimer: 0,
                spawnRate: 1.2,
                difficultyMulti: 1,
                timeAlive: 0,
                shake: 0,
                flash: 0
            };
            scoreEl.innerText = '0';
            gameOverScreen.style.display = 'none';
            lastTime = performance.now();
        }

        function firePulse() {
            if (state.chargeRadius > state.playerRadius) {
                state.pulses.push({
                    r: state.chargeRadius,
                    alpha: 1,
                    expansionRate: 800
                });
                checkCollisions(state.chargeRadius);
                state.shake = Math.min(25, state.chargeRadius / 8);
                playTone(100 + state.chargeRadius, 'sine', 0.5, 0.2); // Pulse sound
            }
            state.chargeRadius = 0;
        }

        function checkCollisions(radius) {
            let hits = 0;
            for (let i = state.enemies.length - 1; i >= 0; i--) {
                let e = state.enemies[i];
                let dist = Math.hypot(e.x - cx, e.y - cy);
                if (dist <= radius + e.r) {
                    hits++;
                    createExplosion(e.x, e.y, e.color);
                    state.enemies.splice(i, 1);
                }
            }
            
            if (hits > 0) {
                let points = hits * hits * 10; // Combo multiplier
                state.score += points;
                scoreEl.innerText = state.score;
                if (hits > state.maxCombo) {
                    state.maxCombo = hits;
                    comboEl.innerText = state.maxCombo;
                }
                state.flash = Math.min(0.8, hits * 0.15); // Hit pause/flash
                playTone(400 + hits*100, 'square', 0.2, 0.1); // Hit sound
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 150 + 50;
                state.particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: Math.random() * 0.6 + 0.2,
                    maxLife: 1,
                    color: color
                });
            }
        }

        function spawnEnemy() {
            let angle = Math.random() * Math.PI * 2;
            let spawnDist = Math.max(w, h) / 2 + 50;
            let colors = ['#f05', '#0f5', '#05f', '#f50', '#f0f', '#ff0'];
            state.enemies.push({
                x: cx + Math.cos(angle) * spawnDist,
                y: cy + Math.sin(angle) * spawnDist,
                r: 6 + Math.random() * 6,
                speed: 60 + Math.random() * 60 * state.difficultyMulti,
                color: colors[Math.floor(Math.random() * colors.length)],
                wobbleOffset: Math.random() * Math.PI * 2
            });
        }

        function gameOver() {
            state.isGameOver = true;
            finalScoreEl.innerText = 'SCORE: ' + state.score;
            gameOverScreen.style.display = 'flex';
            createExplosion(cx, cy, '#0ff');
            state.shake = 40;
            playTone(150, 'sawtooth', 1, 0.3); // Game over sound
        }

        function update(dt) {
            if (state.isGameOver) {
                updateParticles(dt);
                return;
            }

            state.timeAlive += dt;
            state.difficultyMulti = 1 + (state.timeAlive / 20); // Faster scaling
            
            state.spawnTimer += dt;
            let currentSpawnRate = state.spawnRate * state.difficultyMulti;
            if (currentSpawnRate > 8) currentSpawnRate = 8; // Cap
            
            if (state.spawnTimer > 1 / currentSpawnRate) {
                spawnEnemy();
                state.spawnTimer = 0;
            }

            if (state.charging) {
                state.chargeRadius += state.chargeRate * dt;
                if (state.chargeRadius > state.maxCharge) {
                    state.chargeRadius = state.maxCharge;
                }
            }

            for (let i = state.enemies.length - 1; i >= 0; i--) {
                let e = state.enemies[i];
                let angle = Math.atan2(cy - e.y, cx - e.x);
                
                // Add some wobble
                let wobble = Math.sin(state.timeAlive * 5 + e.wobbleOffset) * 0.5;
                angle += wobble;

                e.x += Math.cos(angle) * e.speed * dt;
                e.y += Math.sin(angle) * e.speed * dt;

                let dist = Math.hypot(e.x - cx, e.y - cy);
                if (dist < e.r + state.playerRadius) {
                    gameOver();
                }
            }

            for (let i = state.pulses.length - 1; i >= 0; i--) {
                let p = state.pulses[i];
                p.r += p.expansionRate * dt;
                p.alpha -= dt * 2.5;
                if (p.alpha <= 0) state.pulses.splice(i, 1);
            }

            updateParticles(dt);

            if (state.shake > 0) {
                state.shake -= dt * 60;
                if (state.shake < 0) state.shake = 0;
            }
            if (state.flash > 0) {
                state.flash -= dt * 3;
                if (state.flash < 0) state.flash = 0;
            }
        }

        function updateParticles(dt) {
            for (let i = state.particles.length - 1; i >= 0; i--) {
                let p = state.particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
                if (p.life <= 0) state.particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, w, h);

            ctx.save();
            if (state.shake > 0) {
                let dx = (Math.random() - 0.5) * state.shake;
                let dy = (Math.random() - 0.5) * state.shake;
                ctx.translate(dx, dy);
            }

            if (state.flash > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${state.flash})`;
                ctx.fillRect(0, 0, w, h);
            }

            ctx.globalCompositeOperation = 'lighter';

            // Draw Core
            if (!state.isGameOver) {
                ctx.beginPath();
                ctx.arc(cx, cy, state.playerRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#0ff';
                ctx.shadowColor = '#0ff';
                ctx.shadowBlur = 20;
                ctx.fill();
                ctx.closePath();

                // Draw Charge outline
                if (state.chargeRadius > 0) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, state.chargeRadius, 0, Math.PI * 2);
                    let intensity = state.chargeRadius / state.maxCharge;
                    ctx.strokeStyle = `rgba(0, 255, 255, ${0.4 + 0.6 * intensity})`;
                    ctx.lineWidth = 2 + 4 * intensity;
                    ctx.shadowColor = '#0ff';
                    ctx.shadowBlur = 10 + 20 * intensity;
                    ctx.stroke();
                    ctx.closePath();
                    
                    // Fill subtle charging area
                    ctx.beginPath();
                    ctx.arc(cx, cy, state.chargeRadius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 255, 255, ${0.1 * intensity})`;
                    ctx.fill();
                    ctx.closePath();
                }
            }

            // Draw expanding Pulses
            state.pulses.forEach(p => {
                ctx.beginPath();
                ctx.arc(cx, cy, p.r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(0, 255, 255, ${p.alpha})`;
                ctx.lineWidth = 15 * p.alpha;
                ctx.shadowColor = '#0ff';
                ctx.shadowBlur = 30 * p.alpha;
                ctx.stroke();
                ctx.closePath();
            });

            // Draw Enemies
            state.enemies.forEach(e => {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
                ctx.fillStyle = e.color;
                ctx.shadowColor = e.color;
                ctx.shadowBlur = 20;
                ctx.fill();
                ctx.closePath();
            });

            // Draw Particles
            state.particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.fill();
                ctx.globalAlpha = 1.0;
                ctx.closePath();
            });

            ctx.restore();
        }

        function loop(time) {
            let dt = (time - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1; // clamp dt
            lastTime = time;

            update(dt);
            draw();

            requestAnimationFrame(loop);
        }

        lastTime = performance.now();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
