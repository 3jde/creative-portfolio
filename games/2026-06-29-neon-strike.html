<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEON STRIKE | Daily Mini Game</title>
  <style>
    /* CSS for neon look */
    body {
      margin: 0;
      padding: 0;
      background: #050510;
      overflow: hidden;
      touch-action: none;
      font-family: 'Space Mono', monospace;
      color: #ccff00;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      box-sizing: border-box;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      font-size: 1.5rem;
      text-shadow: 0 0 10px #ccff00;
      font-family: 'VT323', monospace;
      margin-top: 40px;
    }
    .health {
      color: #ff0055;
      text-shadow: 0 0 10px #ff0055;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5,5,16,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      backdrop-filter: blur(5px);
      z-index: 10;
    }
    .title {
      font-size: 4rem;
      font-family: 'VT323', monospace;
      margin-bottom: 10px;
      text-shadow: 0 0 20px #ccff00;
      text-align: center;
    }
    .instructions {
      text-align: center;
      margin-bottom: 30px;
      max-width: 320px;
      line-height: 1.5;
    }
    .btn {
      background: transparent;
      border: 2px solid #ccff00;
      color: #ccff00;
      font-family: 'Space Mono', monospace;
      padding: 10px 20px;
      font-size: 1.2rem;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
      box-shadow: 0 0 10px rgba(204,255,0,0.3);
    }
    .btn:hover {
      background: #ccff00;
      color: #050510;
      box-shadow: 0 0 20px #ccff00;
    }
    .hidden {
      display: none !important;
    }
    .game-over-title {
      color: #ff0055;
      text-shadow: 0 0 20px #ff0055;
    }
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      text-decoration: none;
      color: #ccff00;
      pointer-events: auto;
      border: 1px solid #ccff00;
      padding: 5px 10px;
      font-size: 0.8rem;
    }
    .back-btn:hover {
      background: #ccff00;
      color: #050510;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div class="ui-layer">
    <a href="../games.html" class="back-btn">&lt; BACK</a>
    <div class="top-bar">
      <div id="scoreDisplay">SCORE: 0</div>
      <div id="healthDisplay" class="health">CITY: 100%</div>
    </div>
  </div>
  
  <div id="startScreen" class="overlay">
    <div class="title">NEON STRIKE</div>
    <div class="instructions">
      DEFEND THE BOTTOM LINE.<br><br>
      Drag anywhere to slow time and aim.<br>
      Release to DASH into targets.<br>
      Chaining hits mid-air resets your dash!
    </div>
    <button class="btn" id="startBtn">ENGAGE</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <div class="title game-over-title">SYSTEM FAILURE</div>
    <div class="instructions" id="finalScore">
      SCORE: 0
    </div>
    <button class="btn" id="restartBtn">REBOOT</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const healthDisplay = document.getElementById('healthDisplay');
    const finalScore = document.getElementById('finalScore');
    
    let width, height;
    
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    let state = 'start';
    let score = 0;
    let health = 100;
    let timeScale = 1.0;
    let targetTimeScale = 1.0;
    let lastTime = 0;
    let spawnTimer = 0;
    let spawnRate = 2000;
    let shakeAmount = 0;

    let player;
    let targets = [];
    let particles = [];
    let trails = [];
    
    let pointer = { x: 0, y: 0, active: false, startX: 0, startY: 0 };
    
    class Player {
      constructor() {
        this.x = width / 2;
        this.y = height - 50;
        this.vx = 0;
        this.vy = 0;
        this.radius = 15;
        this.dashing = false;
        this.dashTimer = 0;
        this.canDash = true;
        this.color = '#ccff00';
      }
      
      update(dt) {
        if (this.dashing) {
          this.x += this.vx * dt;
          this.y += this.vy * dt;
          this.dashTimer -= dt;
          if (this.dashTimer <= 0) {
            this.dashing = false;
            this.vx *= 0.2;
            this.vy *= 0.2;
          }
          if (Math.random() > 0.3) {
            trails.push(new Trail(this.x, this.y, this.color, this.radius));
          }
        } else {
          this.vy += 2000 * dt; // Gravity
          this.x += this.vx * dt;
          this.y += this.vy * dt;
          this.vx *= Math.pow(0.5, dt);
        }
        
        if (this.x < this.radius) { this.x = this.radius; this.vx *= -0.5; }
        if (this.x > width - this.radius) { this.x = width - this.radius; this.vx *= -0.5; }
        
        if (this.y > height - this.radius) {
          this.y = height - this.radius;
          this.vy = 0;
          this.vx *= Math.pow(0.1, dt);
          this.canDash = true;
        }
      }
      
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        
        if (this.canDash) {
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, this.radius + 5 + Math.sin(Date.now()*0.01)*2, 0, Math.PI*2);
          ctx.stroke();
        }
        ctx.restore();
      }
      
      dash(dx, dy) {
        if (!this.canDash) return;
        let dist = Math.hypot(dx, dy);
        if (dist < 10) return;
        
        let speed = 2500;
        this.vx = (dx / dist) * speed;
        this.vy = (dy / dist) * speed;
        this.dashing = true;
        this.dashTimer = 0.2;
        this.canDash = false;
        
        for(let i=0; i<15; i++) {
            particles.push(new Particle(this.x, this.y, -this.vx*0.2 + (Math.random()-0.5)*200, -this.vy*0.2 + (Math.random()-0.5)*200, this.color));
        }
      }
    }
    
    class Target {
      constructor() {
        this.radius = 20;
        this.x = Math.random() * (width - this.radius*2) + this.radius;
        this.y = -50;
        this.vy = 100 + Math.random() * 150 + (score * 2);
        this.color = '#ff0055';
        this.markedForDeletion = false;
      }
      
      update(dt) {
        this.y += this.vy * dt;
        if (this.y > height) {
          this.markedForDeletion = true;
          health -= 10;
          shakeAmount = 15;
          createExplosion(this.x, this.y, this.color, 20);
        }
      }
      
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.moveTo(0, -this.radius);
        ctx.lineTo(this.radius, 0);
        ctx.lineTo(0, this.radius);
        ctx.lineTo(-this.radius, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }
    
    class Particle {
      constructor(x, y, vx, vy, color) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.life = 1.0;
        this.decay = 0.5 + Math.random() * 1.5;
        this.size = 2 + Math.random() * 4;
      }
      update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= this.decay * dt;
      }
      draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.globalAlpha = 1.0;
      }
    }

    class Trail {
      constructor(x, y, color, size) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = size;
        this.life = 1.0;
        this.decay = 3.0;
      }
      update(dt) {
        this.life -= this.decay * dt;
        this.size *= 0.9;
      }
      draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }
    }

    function createExplosion(x, y, color, count) {
      for (let i=0; i<count; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 400 + 100;
        particles.push(new Particle(x, y, Math.cos(angle)*speed, Math.sin(angle)*speed, color));
      }
    }

    function handleDown(e) {
      if (state !== 'playing') return;
      pointer.active = true;
      pointer.startX = e.touches ? e.touches[0].clientX : e.clientX;
      pointer.startY = e.touches ? e.touches[0].clientY : e.clientY;
      pointer.x = pointer.startX;
      pointer.y = pointer.startY;
      if (player.canDash) {
        targetTimeScale = 0.1;
      }
    }
    
    function handleMove(e) {
      if (state !== 'playing' || !pointer.active) return;
      e.preventDefault();
      pointer.x = e.touches ? e.touches[0].clientX : e.clientX;
      pointer.y = e.touches ? e.touches[0].clientY : e.clientY;
    }
    
    function handleUp(e) {
      if (state !== 'playing' || !pointer.active) return;
      pointer.active = false;
      targetTimeScale = 1.0;
      
      let dx = pointer.startX - pointer.x;
      let dy = pointer.startY - pointer.y;
      player.dash(dx, dy);
    }
    
    window.addEventListener('mousedown', handleDown, {passive: false});
    window.addEventListener('mousemove', handleMove, {passive: false});
    window.addEventListener('mouseup', handleUp);
    
    window.addEventListener('touchstart', handleDown, {passive: false});
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('touchend', handleUp);
    
    function initGame() {
      player = new Player();
      targets = [];
      particles = [];
      trails = [];
      score = 0;
      health = 100;
      timeScale = 1.0;
      targetTimeScale = 1.0;
      spawnTimer = 0;
      spawnRate = 2000;
      state = 'playing';
      updateUI();
      lastTime = performance.now();
    }
    
    function updateUI() {
      scoreDisplay.innerText = `SCORE: ${score}`;
      healthDisplay.innerText = `CITY: ${health}%`;
    }
    
    function gameOver() {
      state = 'gameover';
      gameOverScreen.classList.remove('hidden');
      finalScore.innerText = `SCORE: ${score}`;
    }

    startBtn.addEventListener('click', () => {
      startScreen.classList.add('hidden');
      initGame();
    });
    
    restartBtn.addEventListener('click', () => {
      gameOverScreen.classList.add('hidden');
      initGame();
    });

    function gameLoop(time) {
      requestAnimationFrame(gameLoop);
      
      let dtRaw = (time - lastTime) / 1000;
      lastTime = time;
      if (dtRaw > 0.1) dtRaw = 0.1;
      
      if (state !== 'playing') return;
      
      timeScale += (targetTimeScale - timeScale) * 10 * dtRaw;
      let dt = dtRaw * timeScale;
      
      ctx.fillStyle = 'rgba(5, 5, 16, 0.5)';
      ctx.fillRect(0, 0, width, height);
      
      if (shakeAmount > 0) {
        ctx.save();
        let dx = (Math.random() - 0.5) * shakeAmount;
        let dy = (Math.random() - 0.5) * shakeAmount;
        ctx.translate(dx, dy);
        shakeAmount *= 0.9;
        if (shakeAmount < 0.5) shakeAmount = 0;
      }
      
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        targets.push(new Target());
        spawnTimer = (spawnRate / 1000) * (0.8 + Math.random() * 0.4);
        spawnRate = Math.max(600, spawnRate - 15);
      }
      
      for (let i = trails.length - 1; i >= 0; i--) {
        trails[i].update(dtRaw);
        trails[i].draw(ctx);
        if (trails[i].life <= 0) trails.splice(i, 1);
      }

      player.update(dt);
      player.draw(ctx);
      
      if (pointer.active && player.canDash) {
        let dx = pointer.startX - pointer.x;
        let dy = pointer.startY - pointer.y;
        let dist = Math.hypot(dx, dy);
        if (dist > 10) {
          ctx.strokeStyle = 'rgba(204, 255, 0, 0.5)';
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          ctx.moveTo(player.x, player.y);
          ctx.lineTo(player.x + dx * 1.5, player.y + dy * 1.5);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
      
      for (let i = targets.length - 1; i >= 0; i--) {
        let t = targets[i];
        t.update(dt);
        t.draw(ctx);
        
        let dist = Math.hypot(player.x - t.x, player.y - t.y);
        if (dist < player.radius + t.radius) {
          t.markedForDeletion = true;
          score += 10;
          shakeAmount = 10;
          createExplosion(t.x, t.y, t.color, 30);
          player.canDash = true;
          updateUI();
        }
        
        if (t.markedForDeletion) {
          targets.splice(i, 1);
        }
      }
      
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dtRaw);
        particles[i].draw(ctx);
        if (particles[i].life <= 0) particles.splice(i, 1);
      }
      
      if (health <= 0) gameOver();
      if (shakeAmount > 0) ctx.restore();
    }
    
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
