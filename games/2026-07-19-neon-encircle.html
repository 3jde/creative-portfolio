<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEON ENCIRCLE | Daily Mini Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=VT323&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050505;
      overflow: hidden;
      touch-action: none;
      font-family: 'Space Mono', monospace;
      color: #fff;
      user-select: none;
      -webkit-user-select: none;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0; left: 0;
    }
    .ui-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 16px 20px;
    }
    .title {
      font-family: 'VT323', monospace;
      font-size: 2.2rem;
      line-height: 1;
      text-shadow: 0 0 12px rgba(204, 255, 0, 0.4);
      color: #ccff00;
    }
    .top-right {
      text-align: right;
    }
    .score {
      font-size: 1.8rem;
      font-weight: bold;
      color: #00ffff;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
    }
    .level {
      font-size: 1rem;
      color: rgba(255,255,255,0.5);
      margin-top: 2px;
    }
    .captured-count {
      font-size: 0.9rem;
      color: #ff00ff;
      margin-top: 2px;
    }

    .hint {
      position: absolute;
      bottom: 80px;
      width: 100%;
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
      pointer-events: none;
      animation: breathe 2.5s ease-in-out infinite;
      letter-spacing: 1px;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    .back-link {
      position: absolute;
      bottom: 16px;
      left: 16px;
      color: rgba(255,255,255,0.35);
      text-decoration: none;
      font-size: 0.85rem;
      pointer-events: auto;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 4px 10px;
      transition: all 0.2s;
      font-family: 'Space Mono', monospace;
      z-index: 15;
    }
    .back-link:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.5);
    }

    #gameOverScreen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(5,5,5,0.88);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      z-index: 20;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    #gameOverScreen.active { display: flex; }
    .go-title {
      font-family: 'VT323', monospace;
      font-size: 4rem;
      color: #ff0055;
      text-shadow: 0 0 30px rgba(255,0,85,0.6);
      margin-bottom: 8px;
    }
    .go-sub {
      font-size: 1.2rem;
      color: rgba(255,255,255,0.6);
      margin-bottom: 30px;
    }
    .go-score {
      font-size: 2.5rem;
      color: #ccff00;
      text-shadow: 0 0 15px rgba(204,255,0,0.4);
      margin-bottom: 8px;
    }
    .go-detail {
      font-size: 1rem;
      color: #00ffff;
      margin-bottom: 40px;
    }
    .restart-btn {
      background: transparent;
      border: 2px solid #00ffff;
      color: #00ffff;
      font-family: 'Space Mono', monospace;
      font-size: 1.3rem;
      padding: 14px 36px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
      box-shadow: 0 0 15px rgba(0,255,255,0.2);
    }
    .restart-btn:hover,
    .restart-btn:active {
      background: #00ffff;
      color: #050505;
      box-shadow: 0 0 30px rgba(0,255,255,0.5);
    }

    @media (max-width: 480px) {
      .title { font-size: 1.6rem; }
      .score { font-size: 1.4rem; }
      .go-title { font-size: 2.8rem; }
      .hint { font-size: 0.8rem; bottom: 60px; }
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div class="ui-layer">
    <div class="top-bar">
      <div class="title">NEON<br>ENCIRCLE</div>
      <div class="top-right">
        <div class="score" id="scoreDisplay">0</div>
        <div class="level" id="levelDisplay">WAVE 1</div>
        <div class="captured-count" id="capturedDisplay">CLAIMED: 0</div>
      </div>
    </div>
    <div class="hint" id="hintText">DRAG TO DRAW A TRAIL · CLOSE THE LOOP TO CAPTURE</div>
    <a href="games.html" class="back-link">← GAMES</a>
  </div>

  <div id="gameOverScreen">
    <div class="go-title">SYSTEM BREACH</div>
    <div class="go-sub">THE FIELD WAS OVERRUN</div>
    <div class="go-score">SCORE: <span id="finalScore">0</span></div>
    <div class="go-detail">ENEMIES CAPTURED: <span id="finalCaptured">0</span></div>
    <button class="restart-btn" id="restartBtn">⟳ DEPLOY AGAIN</button>
  </div>

  <script>
    (function() {
      'use strict';

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const scoreDisplay = document.getElementById('scoreDisplay');
      const levelDisplay = document.getElementById('levelDisplay');
      const capturedDisplay = document.getElementById('capturedDisplay');
      const hintText = document.getElementById('hintText');
      const gameOverScreen = document.getElementById('gameOverScreen');
      const finalScore = document.getElementById('finalScore');
      const finalCaptured = document.getElementById('finalCaptured');
      const restartBtn = document.getElementById('restartBtn');

      let W, H;

      // ── State ──
      const STATE = { PLAYING: 0, GAMEOVER: 1, DRAWING: 2 };
      let gameState = STATE.PLAYING;
      let score = 0;
      let wave = 1;
      let totalCaptured = 0;
      let frames = 0;
      let spawnTimer = 0;

      // ── Polish / Juice ──
      let shakeTime = 0;
      let shakeMag = 0;
      let hitPause = 0;
      let flashAlpha = 0; // white flash on capture

      // ── Drawing trail ──
      let trail = [];           // array of {x,y}
      let isDrawing = false;
      let trailColor = '#ccff00';
      let trailLife = 600;      // ms before trail fades
      let closedLoops = [];     // array of trail arrays that formed closed loops

      // ── Enemies ──
      let enemies = [];
      let particles = [];
      let floatTexts = [];

      // ── Constants ──
      const PLAYER_RADIUS = 8;
      const ENEMY_RADIUS = 10;
      const TRAIL_WIDTH = 4;
      const LOOP_CLOSE_DIST = 30; // pixels to auto-close loop
      const MAX_ENEMIES = 30;
      const SPAWN_INTERVAL_BASE = 80; // frames
      
      // ── Colors ──
      const COLORS = {
        bg: '#0a0a0f',
        grid: 'rgba(204,255,0,0.03)',
        trail: '#ccff00',
        trailGlow: 'rgba(204,255,0,0.3)',
        enemy: '#ff3355',
        enemyGlow: 'rgba(255,51,85,0.4)',
        capture: '#00ffff',
        captureGlow: 'rgba(0,255,255,0.6)',
        node_captured: '#00ff88',
      };

      // ── Resize ──
      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
      }
      window.addEventListener('resize', resize);
      resize();

      // ── Utility ──
      function dist(x1, y1, x2, y2) {
        return Math.hypot(x2 - x1, y2 - y1);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      function randInt(min, max) {
        return Math.floor(rand(min, max + 1));
      }

      // Point-in-polygon (ray casting)
      function pointInPolygon(px, py, polygon) {
        let inside = false;
        const n = polygon.length;
        for (let i = 0, j = n - 1; i < n; j = i++) {
          const xi = polygon[i].x, yi = polygon[i].y;
          const xj = polygon[j].x, yj = polygon[j].y;
          if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) {
            inside = !inside;
          }
        }
        return inside;
      }

      // ── Game logic ──
      function spawnEnemy() {
        if (enemies.length >= MAX_ENEMIES) return;
        // Spawn from edges
        let x, y;
        const side = randInt(0, 3);
        switch (side) {
          case 0: x = rand(0, W); y = -20; break;          // top
          case 1: x = W + 20; y = rand(0, H); break;        // right
          case 2: x = rand(0, W); y = H + 20; break;        // bottom
          case 3: x = -20; y = rand(0, H); break;           // left
        }
        // Speed increases with wave
        const speed = 1 + wave * 0.3 + rand(-0.3, 0.5);
        // Target is center area, spread with wave
        const targetX = W / 2 + rand(-W * 0.2, W * 0.2);
        const targetY = H / 2 + rand(-H * 0.2, H * 0.2);
        const angle = Math.atan2(targetY - y, targetX - x);
        
        enemies.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: ENEMY_RADIUS + rand(-2, 2),
          captured: false,
          wobble: rand(0, Math.PI * 2),
          wobbleSpeed: rand(0.02, 0.05) * (wave > 3 ? 1.5 : 1),
          wobbleAmp: rand(0.3, 1),
        });
      }

      function addParticles(x, y, color, count, speed) {
        for (let i = 0; i < count; i++) {
          const angle = rand(0, Math.PI * 2);
          const spd = rand(1, speed || 4);
          particles.push({
            x, y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            life: rand(30, 60),
            maxLife: 60,
            radius: rand(1.5, 4),
            color: color,
          });
        }
      }

      function addFloatText(x, y, text, color) {
        floatTexts.push({
          x, y,
          text: text,
          color: color || '#ffffff',
          life: 50,
          maxLife: 50,
          vy: -1.5,
        });
      }

      function captureEnemiesInLoop(loop) {
        const toCapture = [];
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          if (e.captured) continue;
          if (pointInPolygon(e.x, e.y, loop)) {
            e.captured = true;
            toCapture.push(e);
          }
        }
        if (toCapture.length > 0) {
          // Calculate centroid
          let cx2 = 0, cy2 = 0;
          for (const e of toCapture) { cx2 += e.x; cy2 += e.y; }
          cx2 /= toCapture.length;
          cy2 /= toCapture.length;

          // Capture burst
          addParticles(cx2, cy2, '#00ffff', 30, 6);
          addParticles(cx2, cy2, '#ccff00', 20, 4);
          
          // Score: base 100 per enemy + wave bonus
          const bonus = Math.floor(toCapture.length > 1 ? toCapture.length * 50 : 0);
          const baseScore = toCapture.length * 100;
          const waveBonus = wave * 20 * toCapture.length;
          const gained = baseScore + bonus + waveBonus;
          score += gained;
          totalCaptured += toCapture.length;
          
          const plural = toCapture.length > 1 ? 's' : '';
          addFloatText(cx2, cy2 - 20, `+${gained}`, '#ccff00');
          if (toCapture.length > 1) {
            addFloatText(cx2, cy2 + 10, `${toCapture.length} CAPTURED`, '#00ffff');
          }

          // Juice
          shakeMag = toCapture.length * 1.5;
          shakeTime = 10;
          flashAlpha = 0.3;
          hitPause = 4;

          return toCapture.length;
        }
        return 0;
      }

      function closeLoop() {
        if (trail.length < 8) return false;
        const first = trail[0];
        const last = trail[trail.length - 1];
        if (dist(first.x, first.y, last.x, last.y) < LOOP_CLOSE_DIST) {
          // Form a closed loop polygon (trail + point back to start)
          const loop = trail.slice();
          
          // Capture enemies inside
          const captured = captureEnemiesInLoop(loop);
          
          // Store closed loop for rendering fade-out
          closedLoops.push({
            points: loop,
            life: 60,
            maxLife: 60,
            color: captured > 0 ? '#00ffff' : '#ccff00',
          });

          // Clear current trail
          trail = [];
          isDrawing = false;

          // Hide hint after first capture
          if (totalCaptured > 0) {
            hintText.style.opacity = 0;
          }

          return captured > 0;
        }
        return false;
      }

      function checkWaveComplete() {
        // Wave advances when enough enemies captured
        const threshold = wave * 3 + 5;
        if (totalCaptured >= threshold) {
          wave++;
          levelDisplay.textContent = `WAVE ${wave}`;
          // Spawn new batch immediately
          const waveSpawn = Math.min(8 + wave * 2, MAX_ENEMIES);
          for (let i = 0; i < waveSpawn; i++) {
            spawnEnemy();
          }
          addFloatText(W / 2, H / 2, `WAVE ${wave}`, '#00ffff');
          shakeMag = 8;
          shakeTime = 12;
        }
      }

      // ── Input ──
      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        if (e.touches && e.touches.length > 0) {
          return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
        }
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      function startDraw(pos) {
        if (gameState !== STATE.PLAYING) return;
        isDrawing = true;
        trail = [{ x: pos.x, y: pos.y }];
        hintText.style.opacity = '0.3';
      }

      function moveDraw(pos) {
        if (!isDrawing || gameState !== STATE.PLAYING) return;
        const last = trail[trail.length - 1];
        if (dist(last.x, last.y, pos.x, pos.y) > 4) {
          trail.push({ x: pos.x, y: pos.y });
        }
        // Auto-close detection
        if (trail.length > 15) {
          const first = trail[0];
          const d = dist(first.x, first.y, pos.x, pos.y);
          if (d < LOOP_CLOSE_DIST) {
            closeLoop();
          }
        }
        // Cut trail if it gets too long (prevents infinite trails)
        if (trail.length > 200) {
          closeLoop();
        }
      }

      function endDraw() {
        if (isDrawing && trail.length > 0) {
          closeLoop();
        }
        isDrawing = false;
      }

      // Mouse
      canvas.addEventListener('mousedown', (e) => startDraw(getPos(e)));
      canvas.addEventListener('mousemove', (e) => moveDraw(getPos(e)));
      canvas.addEventListener('mouseup', endDraw);
      canvas.addEventListener('mouseleave', endDraw);

      // Touch
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startDraw(getPos(e));
      }, { passive: false });
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        moveDraw(getPos(e));
      }, { passive: false });
      canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        endDraw();
      }, { passive: false });
      canvas.addEventListener('touchcancel', (e) => {
        e.preventDefault();
        endDraw();
      }, { passive: false });

      // Restart
      function resetGame() {
        gameState = STATE.PLAYING;
        score = 0;
        wave = 1;
        totalCaptured = 0;
        frames = 0;
        spawnTimer = 0;
        enemies = [];
        particles = [];
        floatTexts = [];
        trail = [];
        closedLoops = [];
        isDrawing = false;
        shakeTime = 0;
        flashAlpha = 0;
        hitPause = 0;
        hintText.style.opacity = '1';
        updateUI();
        gameOverScreen.classList.remove('active');
        // Initial spawn
        for (let i = 0; i < 5; i++) spawnEnemy();
      }

      restartBtn.addEventListener('click', resetGame);
      restartBtn.addEventListener('touchstart', (e) => { e.preventDefault(); resetGame(); }, { passive: false });

      // ── Update ──
      function update() {
        if (gameState === STATE.GAMEOVER) return;
        if (hitPause > 0) { hitPause--; return; }

        frames++;

        // Spawn timer
        spawnTimer++;
        const interval = Math.max(20, SPAWN_INTERVAL_BASE - wave * 5);
        if (spawnTimer >= interval) {
          spawnTimer = 0;
          spawnEnemy();
        }

        // Update enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          if (e.captured) {
            // Captured enemies dissipate
            e.radius -= 0.3;
            if (e.radius <= 0) {
              enemies.splice(i, 1);
            }
            continue;
          }
          // Movement - slight wobble
          e.wobble += e.wobbleSpeed;
          const wobX = Math.cos(e.wobble) * e.wobbleAmp;
          const wobY = Math.sin(e.wobble + 1) * e.wobbleAmp;
          e.x += e.vx + wobX;
          e.y += e.vy + wobY;

          // Check if enemy escaped off-screen (after being on screen)
          const margin = 60;
          // Only count as "escaped" if they've been on screen and leave
          const onScreen = e.x > -margin && e.x < W + margin && e.y > -margin && e.y < H + margin;
          if (!onScreen && e.x < -200 || e.x > W + 200 || e.y < -200 || e.y > H + 200) {
            // Enemy escaped! Player takes damage
            if (!e.captured) {
              gameOver();
            }
            enemies.splice(i, 1);
            continue;
          }

          // Keep roughly heading toward center (some randomness)
          e.vx += (W / 2 - e.x) * 0.0005;
          e.vy += (H / 2 - e.y) * 0.0005;
          // Clamp speed
          const spd = Math.hypot(e.vx, e.vy);
          const maxSpd = 2 + wave * 0.4;
          if (spd > maxSpd) {
            e.vx = (e.vx / spd) * maxSpd;
            e.vy = (e.vy / spd) * maxSpd;
          }
        }

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.96;
          p.vy *= 0.96;
          p.life--;
          if (p.life <= 0) particles.splice(i, 1);
        }

        // Update float texts
        for (let i = floatTexts.length - 1; i >= 0; i--) {
          const ft = floatTexts[i];
          ft.y += ft.vy;
          ft.life--;
          if (ft.life <= 0) floatTexts.splice(i, 1);
        }

        // Update closed loops
        for (let i = closedLoops.length - 1; i >= 0; i--) {
          closedLoops[i].life--;
          if (closedLoops[i].life <= 0) closedLoops.splice(i, 1);
        }

        // Shake decay
        if (shakeTime > 0) shakeTime--;
        if (flashAlpha > 0) flashAlpha *= 0.9;

        // Check wave
        checkWaveComplete();
        updateUI();
      }

      function gameOver() {
        gameState = STATE.GAMEOVER;
        finalScore.textContent = score;
        finalCaptured.textContent = totalCaptured;
        gameOverScreen.classList.add('active');
        addParticles(W/2, H/2, '#ff3355', 50, 8);
      }

      // ── Render ──
      function render() {
        ctx.save();

        // Screen shake
        if (shakeTime > 0) {
          const intensity = shakeMag * (shakeTime / 12);
          ctx.translate(
            rand(-intensity, intensity),
            rand(-intensity, intensity)
          );
        }

        // Background
        ctx.fillStyle = COLORS.bg;
        ctx.fillRect(-10, -10, W + 20, H + 20);

        // Grid
        drawGrid();

        // Closed loops (fading)
        for (const cl of closedLoops) {
          const alpha = cl.life / cl.maxLife;
          ctx.beginPath();
          ctx.moveTo(cl.points[0].x, cl.points[0].y);
          for (let i = 1; i < cl.points.length; i++) {
            ctx.lineTo(cl.points[i].x, cl.points[i].y);
          }
          ctx.closePath();
          
          // Fill
          ctx.fillStyle = `rgba(0, 255, 255, ${alpha * 0.08})`;
          ctx.fill();
          
          // Border glow
          ctx.strokeStyle = `rgba(0, 255, 255, ${alpha * 0.6})`;
          ctx.lineWidth = TRAIL_WIDTH * alpha;
          ctx.shadowColor = '#00ffff';
          ctx.shadowBlur = 15 * alpha;
          ctx.stroke();
          ctx.shadowBlur = 0;
        }

        // Active trail glow
        if (trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(trail[0].x, trail[0].y);
          for (let i = 1; i < trail.length; i++) {
            ctx.lineTo(trail[i].x, trail[i].y);
          }
          // Outer glow
          ctx.strokeStyle = 'rgba(204,255,0,0.2)';
          ctx.lineWidth = TRAIL_WIDTH + 8;
          ctx.shadowColor = '#ccff00';
          ctx.shadowBlur = 20;
          ctx.stroke();
          ctx.shadowBlur = 0;
          
          // Inner line
          ctx.strokeStyle = '#ccff00';
          ctx.lineWidth = TRAIL_WIDTH;
          ctx.shadowColor = '#ccff00';
          ctx.shadowBlur = 8;
          ctx.stroke();
          ctx.shadowBlur = 0;

          // Draw dots along trail
          for (let i = 0; i < trail.length; i += 6) {
            const t = trail[i];
            ctx.beginPath();
            ctx.arc(t.x, t.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(204,255,0,0.5)';
            ctx.fill();
          }
        }

        // Drawing cursor
        if (isDrawing && trail.length > 0) {
          const last = trail[trail.length - 1];
          ctx.beginPath();
          ctx.arc(last.x, last.y, PLAYER_RADIUS, 0, Math.PI * 2);
          ctx.fillStyle = '#ccff00';
          ctx.shadowColor = '#ccff00';
          ctx.shadowBlur = 20;
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        // Enemies
        for (const e of enemies) {
          if (e.captured && e.radius <= 0) continue;
          
          const alpha = e.captured ? Math.max(0, e.radius / ENEMY_RADIUS) : 1;
          
          // Glow
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius + 6, 0, Math.PI * 2);
          ctx.fillStyle = e.captured
            ? `rgba(0, 255, 136, ${alpha * 0.2})`
            : 'rgba(255, 51, 85, 0.2)';
          ctx.fill();

          // Body
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius * alpha, 0, Math.PI * 2);
          if (e.captured) {
            ctx.fillStyle = `rgba(0, 255, 136, ${alpha * 0.8})`;
            ctx.strokeStyle = `rgba(0, 255, 136, ${alpha})`;
          } else {
            // Pulse effect
            const pulse = 1 + Math.sin(frames * 0.08 + e.wobble) * 0.08;
            ctx.fillStyle = '#ff3355';
            ctx.strokeStyle = 'rgba(255, 51, 85, 0.6)';
            ctx.shadowColor = '#ff3355';
            ctx.shadowBlur = 10;
          }
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.shadowBlur = 0;

          // Inner dot
          if (!e.captured) {
            ctx.beginPath();
            ctx.arc(e.x, e.y, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fill();
          }
        }

        // Particles
        for (const p of particles) {
          const alpha = p.life / p.maxLife;
          ctx.globalAlpha = alpha;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius * alpha, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.shadowBlur = 0;
        }
        ctx.globalAlpha = 1;

        // Float texts
        for (const ft of floatTexts) {
          const alpha = ft.life / ft.maxLife;
          ctx.globalAlpha = alpha;
          ctx.font = 'bold 24px "Space Mono", monospace';
          ctx.textAlign = 'center';
          ctx.fillStyle = ft.color;
          ctx.shadowColor = ft.color;
          ctx.shadowBlur = 12;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.shadowBlur = 0;
        }
        ctx.globalAlpha = 1;

        // Flash overlay
        if (flashAlpha > 0) {
          ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
          ctx.fillRect(-10, -10, W + 20, H + 20);
        }

        ctx.restore();
      }

      function drawGrid() {
        ctx.strokeStyle = COLORS.grid;
        ctx.lineWidth = 0.5;
        const spacing = 50;
        for (let x = 0; x < W; x += spacing) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }
        for (let y = 0; y < H; y += spacing) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }

        // Corner markers
        const m = 20;
        ctx.strokeStyle = 'rgba(204,255,0,0.04)';
        ctx.lineWidth = 1;
        const corners = [[10,10],[W-10,10],[10,H-10],[W-10,H-10]];
        for (const [cx2, cy2] of corners) {
          ctx.beginPath();
          ctx.arc(cx2, cy2, m, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      function updateUI() {
        scoreDisplay.textContent = score;
        levelDisplay.textContent = `WAVE ${wave}`;
        capturedDisplay.textContent = `CLAIMED: ${totalCaptured}`;
      }

      // ── Game Loop ──
      function loop() {
        update();
        render();
        requestAnimationFrame(loop);
      }

      // ── Init ──
      resetGame();
      loop();

    })();
  </script>
</body>
</html>
