<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEON SLASH | Daily Mini Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=VT323&display=swap');
    
    body {
      margin: 0;
      padding: 0;
      background: #050505;
      overflow: hidden;
      touch-action: none;
      font-family: 'Space Mono', monospace;
      color: #ccff00;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      box-sizing: border-box;
      z-index: 10;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      font-size: 2rem;
      text-shadow: 0 0 10px #ccff00;
      font-family: 'VT323', monospace;
    }
    .score-display {
      color: #ccff00;
    }
    .lives-display {
      color: #ff0055;
      text-shadow: 0 0 10px #ff0055;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      z-index: 20;
    }
    .hidden {
      display: none !important;
    }
    .title {
      font-family: 'VT323', monospace;
      font-size: 5rem;
      margin-bottom: 10px;
      text-align: center;
      text-shadow: 0 0 20px #ccff00;
    }
    .instructions {
      font-size: 1rem;
      margin-bottom: 30px;
      text-align: center;
      max-width: 80%;
      line-height: 1.5;
    }
    .btn {
      background: transparent;
      color: #ccff00;
      border: 2px solid #ccff00;
      padding: 15px 30px;
      font-family: 'Space Mono', monospace;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }
    .btn:hover {
      background: #ccff00;
      color: #000;
      box-shadow: 0 0 15px #ccff00;
    }
    .back-btn {
      position: absolute;
      bottom: 20px;
      left: 20px;
      pointer-events: auto;
      text-decoration: none;
      color: #ccff00;
      font-size: 1rem;
      border-bottom: 1px dashed #ccff00;
    }
    .back-btn:hover {
      color: #fff;
      border-color: #fff;
    }
    
    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }
    .shake-active {
      animation: shake 0.3s;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  
  <div class="ui-layer">
    <div class="top-bar">
      <div class="score-display">SCORE: <span id="scoreVal">0</span></div>
      <div class="lives-display">LIVES: <span id="livesVal">3</span></div>
    </div>
    <a href="../games.html" class="back-btn">&lt; BACK TO GAMES</a>
  </div>

  <div id="startScreen" class="overlay">
    <div class="title">NEON SLASH</div>
    <div class="instructions">Swipe or drag to slice the neon targets.<br>Avoid slicing the red bombs.<br>Missing a target costs a life.</div>
    <button class="btn" id="startBtn">START SYSTEM</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <div class="title">SYSTEM FAILURE</div>
    <div class="instructions">FINAL SCORE: <span id="finalScore">0</span></div>
    <button class="btn" id="restartBtn">REBOOT</button>
  </div>

  <script>
    // Game Logic
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // State
    let state = 'start'; // start, play, over
    let score = 0;
    let lives = 3;
    let frameCount = 0;
    
    let targets = [];
    let particles = [];
    let trails = [];
    
    let isDrawing = false;
    let currentTrail = [];

    // Constants
    const GOOD_COLOR = '#00ffff';
    const BAD_COLOR = '#ff0055';
    const TRAIL_COLOR = '#ccff00';
    
    // UI elements
    const scoreVal = document.getElementById('scoreVal');
    const livesVal = document.getElementById('livesVal');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScore = document.getElementById('finalScore');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    function startGame() {
      state = 'play';
      score = 0;
      lives = 3;
      targets = [];
      particles = [];
      trails = [];
      currentTrail = [];
      frameCount = 0;
      updateUI();
      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
    }

    function loseLife() {
      lives--;
      updateUI();
      document.body.classList.add('shake-active');
      setTimeout(() => document.body.classList.remove('shake-active'), 300);
      if (lives <= 0) {
        state = 'over';
        finalScore.innerText = score;
        gameOverScreen.classList.remove('hidden');
      }
    }

    function updateUI() {
      scoreVal.innerText = score;
      livesVal.innerText = lives;
    }

    // Input handling (Mouse & Touch)
    function getPointerPos(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function startDraw(e) {
      if (state !== 'play') return;
      isDrawing = true;
      let pos = getPointerPos(e);
      currentTrail = [pos];
    }

    function moveDraw(e) {
      if (!isDrawing || state !== 'play') return;
      e.preventDefault(); // Prevent scrolling
      let pos = getPointerPos(e);
      currentTrail.push(pos);
      if (currentTrail.length > 10) {
        currentTrail.shift();
      }
      checkSlices();
    }

    function endDraw(e) {
      isDrawing = false;
      currentTrail = [];
    }

    canvas.addEventListener('mousedown', startDraw);
    window.addEventListener('mousemove', moveDraw, {passive: false});
    window.addEventListener('mouseup', endDraw);
    
    canvas.addEventListener('touchstart', startDraw, {passive: false});
    window.addEventListener('touchmove', moveDraw, {passive: false});
    window.addEventListener('touchend', endDraw);

    class Target {
      constructor() {
        this.radius = 20 + Math.random() * 20;
        this.type = Math.random() > 0.8 ? 'bad' : 'good';
        this.color = this.type === 'good' ? GOOD_COLOR : BAD_COLOR;
        
        // Spawn from bottom
        this.x = Math.random() * (width - 100) + 50;
        this.y = height + this.radius;
        
        // Velocity
        this.vx = (Math.random() - 0.5) * 4;
        this.vy = -(8 + Math.random() * 6);
        this.gravity = 0.15 + Math.random() * 0.1;
        
        this.active = true;
      }
      
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity; // Apply gravity
        
        // Off screen check
        if (this.y > height + this.radius + 50 && this.vy > 0) {
          this.active = false;
          if (this.type === 'good') {
            loseLife();
          }
        }
      }
      
      draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Draw inner detail
        if (this.type === 'bad') {
          ctx.beginPath();
          ctx.moveTo(this.x - 10, this.y - 10);
          ctx.lineTo(this.x + 10, this.y + 10);
          ctx.moveTo(this.x + 10, this.y - 10);
          ctx.lineTo(this.x - 10, this.y + 10);
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 3;
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius - 8, 0, Math.PI * 2);
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        this.life = 1.0;
        this.decay = 0.02 + Math.random() * 0.03;
        this.color = color;
        this.size = 2 + Math.random() * 4;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
      }
      draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1.0;
      }
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 20; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    function checkSlices() {
      if (currentTrail.length < 2) return;
      const p1 = currentTrail[currentTrail.length - 2];
      const p2 = currentTrail[currentTrail.length - 1];
      
      for (let i = targets.length - 1; i >= 0; i--) {
        let t = targets[i];
        
        let dist = Math.hypot(t.x - p2.x, t.y - p2.y);
        if (dist < t.radius + 20) {
          let l2 = Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2);
          let tx = t.x;
          let ty = t.y;
          let t_p = Math.max(0, Math.min(1, ((tx - p1.x) * (p2.x - p1.x) + (ty - p1.y) * (p2.y - p1.y)) / l2));
          let projX = p1.x + t_p * (p2.x - p1.x);
          let projY = p1.y + t_p * (p2.y - p1.y);
          let distToLine = Math.hypot(tx - projX, ty - projY);
          
          if (distToLine < t.radius) {
            targets.splice(i, 1);
            spawnParticles(t.x, t.y, t.color);
            if (t.type === 'good') {
              score += 10;
              updateUI();
            } else {
              loseLife();
            }
          }
        }
      }
    }

    function drawTrail() {
      if (currentTrail.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(currentTrail[0].x, currentTrail[0].y);
      for (let i = 1; i < currentTrail.length; i++) {
        ctx.lineTo(currentTrail[i].x, currentTrail[i].y);
      }
      ctx.strokeStyle = TRAIL_COLOR;
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowBlur = 20;
      ctx.shadowColor = TRAIL_COLOR;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function loop() {
      requestAnimationFrame(loop);
      
      ctx.fillStyle = 'rgba(5, 5, 5, 0.3)';
      ctx.fillRect(0, 0, width, height);

      if (state !== 'play') return;
      
      frameCount++;
      
      let spawnRate = Math.max(20, 60 - Math.floor(score / 50));
      if (frameCount % spawnRate === 0) {
        targets.push(new Target());
      }
      
      for (let i = targets.length - 1; i >= 0; i--) {
        targets[i].update();
        if (!targets[i].active) {
          targets.splice(i, 1);
        } else {
          targets[i].draw(ctx);
        }
      }
      
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) {
          particles.splice(i, 1);
        } else {
          particles[i].draw(ctx);
        }
      }
      
      drawTrail();
    }

    loop();
  </script>
</body>
</html>
