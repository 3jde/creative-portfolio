<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sketch E: Techwear Cyber-Industrial (Fixed Ratio)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #d1d3d4;
      --dark: #2d2d2d;
      --neon: #efff00;
      --black: #000000;
    }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #111111; /* 深色外背景 */
      color: var(--black);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* 固定尺寸的画板容器 */
    #artboard {
      width: 800px;
      height: 1200px;
      position: relative;
      background: var(--bg);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      transform-origin: center center;
    }
    #canvas-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
    }
    .ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      padding: 40px; /* 固定像素间距 */
      box-sizing: border-box;
    }
    
    /* Left Vertical Typography */
    .left-col {
      display: flex;
      align-items: center;
      width: 120px;
    }
    .vert-title {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 96px; /* 固定像素字体 */
      font-weight: 900;
      line-height: 0.8;
      letter-spacing: -2px;
      text-transform: uppercase;
      margin: 0;
      color: var(--black);
    }
    .vert-sub {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 18px; /* 固定像素字体 */
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--dark);
      margin-right: 20px;
    }

    /* Right Info Blocks */
    .right-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      text-align: right;
      width: 250px;
    }
    .tech-block {
      border-top: 2px solid var(--black);
      padding-top: 10px;
      margin-bottom: 20px;
      width: 100%;
    }
    .tech-title {
      font-weight: 900;
      font-size: 14px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .tech-desc {
      font-size: 10px;
      font-weight: 400;
      color: var(--dark);
      line-height: 1.4;
    }
    
    .warning-box {
      background: var(--neon);
      color: var(--black);
      padding: 15px;
      font-weight: 900;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      box-sizing: border-box;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%); /* Triangle */
      margin-left: auto;
    }

    /* Footer Info */
    .bottom-info {
      position: absolute;
      bottom: 40px;
      left: 160px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      gap: 30px;
      z-index: 3;
    }
  </style>
</head>
<body>
  <!-- 引入外层画板容器 -->
  <div id="artboard">
    <div id="canvas-container"></div>
    
    <div class="ui-layer">
      <div class="left-col">
        <div class="vert-sub">PROJECT_E // 02-07-2026</div>
        <h1 class="vert-title">TECHWEAR</h1>
      </div>
      
      <div class="right-col">
        <div>
          <div class="warning-box">!</div>
          <div class="tech-block" style="margin-top:20px;">
            <div class="tech-title">SYSTEM STATUS</div>
            <div class="tech-desc">
              FLOW FIELDS: ACTIVE<br>
              PARTICLE EMISSION: NOMINAL<br>
              HALO BLOOM: 100%
            </div>
          </div>
          <div class="tech-block">
            <div class="tech-title">AESTHETIC PROTOCOL</div>
            <div class="tech-desc">
              CYBER-INDUSTRIAL // BRUTALIST GRID<br>
              HIGH-VIS NEON CONTRAST
            </div>
          </div>
        </div>
        
        <div class="tech-block">
          <div class="tech-title">ID / 2026-E</div>
          <svg width="100" height="30" viewBox="0 0 100 30">
            <rect x="0" y="0" width="3" height="30" fill="#000" />
            <rect x="5" y="0" width="1" height="30" fill="#000" />
            <rect x="8" y="0" width="4" height="30" fill="#000" />
            <rect x="14" y="0" width="2" height="30" fill="#000" />
            <rect x="18" y="0" width="6" height="30" fill="#000" />
            <rect x="27" y="0" width="1" height="30" fill="#000" />
            <rect x="30" y="0" width="3" height="30" fill="#000" />
            <rect x="35" y="0" width="8" height="30" fill="#000" />
            <rect x="46" y="0" width="2" height="30" fill="#000" />
            <rect x="50" y="0" width="5" height="30" fill="#000" />
            <rect x="58" y="0" width="1" height="30" fill="#000" />
            <rect x="62" y="0" width="4" height="30" fill="#000" />
            <rect x="68" y="0" width="2" height="30" fill="#000" />
            <rect x="72" y="0" width="3" height="30" fill="#000" />
            <rect x="77" y="0" width="1" height="30" fill="#000" />
            <rect x="80" y="0" width="5" height="30" fill="#000" />
            <rect x="87" y="0" width="2" height="30" fill="#000" />
            <rect x="91" y="0" width="6" height="30" fill="#000" />
            <rect x="99" y="0" width="1" height="30" fill="#000" />
          </svg>
        </div>
      </div>
    </div>

    <div class="bottom-info">
      <div>(01) NEON WIREFRAME</div>
      <div>(02) KINETIC ARMOR</div>
    </div>
  </div>

  <script>
    // 监听窗口大小变化，让固定画板等比缩放以适应任意屏幕
    function resizeArtboard() {
      const artboard = document.getElementById('artboard');
      // 以 800x1200 为基准，缩放到屏幕的 95% 尺寸
      const scale = Math.min(window.innerWidth / 800, window.innerHeight / 1200) * 0.95;
      artboard.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resizeArtboard);
    resizeArtboard();

    // P5.js 代码
    let wires = [];
    let particles = [];
    const NUM_WIRES = 150;
    const NUM_PARTICLES = 50;

    function setup() {
      // 画布尺寸固定为 800x1200
      let canvas = createCanvas(800, 1200);
      canvas.parent('canvas-container');
      
      for(let i = 0; i < NUM_WIRES; i++) {
        wires.push(new Wire());
      }
      for(let i = 0; i < NUM_PARTICLES; i++) {
        particles.push(new Particle());
      }
    }

    function draw() {
      background('#d1d3d4');
      
      let centerX = width / 2;
      let centerY = height / 2;

      // 发光背景 (Bloom)
      drawingContext.shadowBlur = 100;
      drawingContext.shadowColor = '#efff00';
      noStroke();
      fill('#efff00');
      let glowRadius = 150 + sin(frameCount * 0.02) * 20;
      ellipse(centerX, centerY, glowRadius, glowRadius * 2.5);
      
      drawingContext.shadowBlur = 0; // 重置阴影

      // 绘制中心的机能多边形装甲
      push();
      translate(centerX, centerY);
      
      for(let layer = 0; layer < 6; layer++) {
        let isDark = layer % 2 === 0;
        fill(isDark ? '#2d2d2d' : '#ffffff');
        stroke(isDark ? '#000000' : '#d1d3d4');
        strokeWeight(2);
        
        beginShape();
        let numVertices = 20 + layer * 2;
        for(let i = 0; i < numVertices; i++) {
          let angle = map(i, 0, numVertices, 0, TWO_PI);
          
          let n = noise(cos(angle) * 1.5 + frameCount * 0.01, sin(angle) * 1.5 + layer, frameCount * 0.005);
          let rBase = (120 - layer * 15); // 针对 800x1200 稍微放大了基准半径
          
          let rx = rBase * map(n, 0, 1, 0.8, 1.5);
          let ry = (rBase * 2.5) * map(n, 0, 1, 0.7, 1.8);
          
          let x = cos(angle) * rx;
          let y = sin(angle) * ry;
          vertex(x, y);
        }
        endShape(CLOSE);
      }
      pop();

      // 流体线缆
      stroke('#efff00');
      noFill();
      strokeWeight(1.5);
      for(let w of wires) {
        w.update();
        w.display();
      }

      // 粒子
      noStroke();
      fill('#efff00');
      drawingContext.shadowBlur = 10;
      drawingContext.shadowColor = '#efff00';
      for(let p of particles) {
        p.update();
        p.display();
      }
      drawingContext.shadowBlur = 0; 
      
      // 电影颗粒叠加层
      loadPixels();
      for(let i = 0; i < pixels.length; i += 4 * floor(random(5, 15))) {
        let val = random(255);
        if(random() > 0.8) {
          pixels[i] = val;
          pixels[i+1] = val;
          pixels[i+2] = val;
          pixels[i+3] = 10; 
        }
      }
      updatePixels();
    }

    class Wire {
      constructor() {
        this.reset();
      }
      reset() {
        this.pos = createVector(random(width), random(height));
        this.history = [];
        this.life = random(50, 200);
      }
      update() {
        this.history.push(this.pos.copy());
        if(this.history.length > 20) this.history.shift();
        
        let nScale = 0.005;
        let angle = noise(this.pos.x * nScale, this.pos.y * nScale, frameCount * 0.002) * TWO_PI * 2;
        
        let dirToCenter = createVector(width/2 - this.pos.x, 0).normalize().mult(0.5);
        
        let vel = p5.Vector.fromAngle(angle).mult(2);
        vel.add(dirToCenter);
        this.pos.add(vel);
        
        this.life--;
        if(this.life <= 0 || this.pos.x < 0 || this.pos.x > width || this.pos.y < 0 || this.pos.y > height) {
          this.reset();
        }
      }
      display() {
        beginShape();
        for(let v of this.history) {
          vertex(v.x, v.y);
        }
        endShape();
      }
    }

    class Particle {
      constructor() {
        this.pos = createVector(random(width/2 - 200, width/2 + 200), random(height/2 - 400, height/2 + 400));
        this.vel = createVector(random(-1, 1), random(-2, 0.5));
        this.size = random(1, 4);
      }
      update() {
        this.pos.add(this.vel);
        this.pos.x += sin(frameCount * 0.05 + this.pos.y) * 0.5;
        if(this.pos.y < 0 || this.pos.y > height) {
          this.pos.y = height / 2 + random(-150, 150);
          this.pos.x = width / 2 + random(-150, 150);
        }
      }
      display() {
        ellipse(this.pos.x, this.pos.y, this.size);
      }
    }
  </script>
</body>
</html>
