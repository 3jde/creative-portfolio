<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Zen | Creative Coder & Digital Artist</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050505; color: #fff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    
    #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: auto; }
    
    #ui-layer {
      position: relative; z-index: 10; pointer-events: none; min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 0 10vw;
    }

    h1 {
      font-size: clamp(4rem, 10vw, 8rem); font-weight: 900; letter-spacing: -4px; line-height: 1;
      margin-bottom: 1.5rem; text-transform: uppercase; mix-blend-mode: exclusion;
      font-family: 'Arial Black', Impact, sans-serif;
    }
    h2 {
      font-size: clamp(1rem, 2vw, 1.5rem); font-weight: 300; letter-spacing: 6px; color: #888;
      margin-bottom: 5rem; text-transform: uppercase;
    }
    
    .nav-links { pointer-events: auto; display: flex; gap: 40px; }
    .nav-links a {
      color: #fff; text-decoration: none; font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
      position: relative; padding-bottom: 5px; transition: color 0.3s;
    }
    .nav-links a:hover { color: #888; }
    .nav-links a::after {
      content: ''; position: absolute; left: 0; bottom: 0; width: 0; height: 1px; background: #fff;
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-links a:hover::after { width: 100%; }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <main id="ui-layer">
    <h1>ONE ZEN</h1>
    <h2>Generative Art & Spatial Design</h2>
    <div class="nav-links">
      <a href="digital.html">Digital Art</a>
      <a href="interior.html">Interior Design</a>
      <a href="painting.html">Oil Painting</a>
      <a href="mailto:hello@example.com">Contact</a>
    </div>
  </main>

  <script>
    let cols, rows; let scl = 40; let zoff = 0;
    function setup() {
      let canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('canvas-container');
      cols = floor(width / scl) + 2; rows = floor(height / scl) + 2;
    }
    function draw() {
      background(5, 5, 5, 50); 
      stroke(255, 255, 255, 40); strokeWeight(1); noFill();
      translate(width / 2, height / 2);
      let targetRotX = map(mouseY, 0, height, -0.05, 0.05); let targetRotY = map(mouseX, 0, width, -0.05, 0.05);
      translate(-width/2 - scl, -height/2 - scl);
      let yoff = 0;
      for (let y = 0; y < rows; y++) {
        let xoff = 0; beginShape(LINES);
        for (let x = 0; x < cols; x++) {
          let n = noise(xoff, yoff, zoff);
          let screenX = x * scl; let screenY = y * scl; let d = dist(mouseX, mouseY, screenX, screenY);
          let distortion = 0; if (d < 300) { distortion = map(d, 0, 300, 50, 0); }
          let offset = map(n, 0, 1, -20, 20) + distortion;
          if (n > 0.65) { vertex(x * scl, y * scl + offset); vertex((x+1) * scl, y * scl - offset); } 
          else { vertex(x * scl, y * scl + offset); vertex(x * scl, (y+1) * scl + offset); }
          xoff += 0.05;
        }
        endShape(); yoff += 0.05;
      }
      zoff += 0.005;
    }
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      cols = floor(width / scl) + 2; rows = floor(height / scl) + 2;
    }
  </script>
</body>
</html>
