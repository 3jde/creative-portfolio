<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ONE ZEN | TERMINAL</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --neon: #ccff00; --bg: #000000; }
    body { background-color: var(--bg); color: var(--neon); font-family: 'Space Mono', monospace; overflow: hidden; }
    #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }
    
    #ui-layer {
      position: relative; z-index: 10; pointer-events: none; height: 100vh;
      display: flex; flex-direction: column; justify-content: space-between; padding: 40px;
    }

    .header { display: flex; justify-content: space-between; align-items: flex-start; }
    .logo { font-family: 'VT323', monospace; font-size: 3rem; line-height: 1; }
    .sys-info { text-align: right; font-size: 0.8rem; line-height: 1.5; }

    .center-title {
      flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; pointer-events: auto;
    }
    .center-title h1 {
      font-family: 'VT323', monospace; font-size: clamp(4rem, 12vw, 10rem); 
      font-weight: normal; letter-spacing: -2px; margin-bottom: 20px;
      border: 2px solid var(--neon); padding: 20px 60px;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px);
    }
    .center-title h1:hover { background: var(--neon); color: var(--bg); cursor: crosshair; }

    .nav-links { pointer-events: auto; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    .nav-links a {
      color: var(--neon); text-decoration: none; font-size: 1rem; padding: 10px 20px;
      border: 1px dashed var(--neon); background: rgba(0,0,0,0.8); transition: all 0.2s;
    }
    .nav-links a::before { content: '( '; }
    .nav-links a::after { content: ' )'; }
    .nav-links a:hover { background: var(--neon); color: var(--bg); border-style: solid; }

    .footer { display: flex; justify-content: space-between; font-size: 0.8rem; border-top: 1px dashed var(--neon); padding-top: 20px; }
    .footer a { color: var(--neon); pointer-events: auto; }
    .footer a:hover { background: var(--neon); color: var(--bg); }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="ui-layer">
    <div class="header">
      <div class="logo">O_ZEN<br>SYS.V1</div>
      <div class="sys-info">
        > STATUS: ONLINE<br>
        > THEME: BRUTALIST_NEON<br>
        > DATE: 2026.03.22
      </div>
    </div>
    
    <div class="center-title">
      <h1>(ONE ZEN)</h1>
      <div class="nav-links">
        <a href="generative.html">CODE ART</a>
        <a href="digital.html">DIGITAL ART</a>
        <a href="generative_graphics.html">GENERATIVE GRAPHICS</a>
        <a href="playground.html">PLAYGROUND</a>
      </div>
    </div>

    <div class="footer">
      <div>// END OF TEST PAGE NUMBER 01 AES</div>
      <div><a href="mailto:t_wangzheng@suda.edu.cn">T_WANGZHENG@SUDA.EDU.CN</a></div>
    </div>
  </div>

  <script>
    let cols, rows;
    let scl = 30; 
    let symbols = ['+', 'x', 'o', '·', 'O', '□', '■', '::', '//'];
    let grid = [];

    function setup() {
      let canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('canvas-container');
      cols = ceil(width / scl);
      rows = ceil(height / scl);
      textAlign(CENTER, CENTER);
      textSize(scl * 0.6);
      textFont('monospace');
      
      for (let i = 0; i < cols; i++) {
        grid[i] = [];
        for (let j = 0; j < rows; j++) {
          grid[i][j] = {
            char: random(symbols),
            isNeonBg: random() > 0.85
          };
        }
      }
    }

    function draw() {
      background(0);
      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
          let x = i * scl;
          let y = j * scl;
          let cell = grid[i][j];
          let d = dist(mouseX, mouseY, x + scl/2, y + scl/2);
          
          if (d < scl * 2) {
            if (frameCount % 5 === 0) cell.char = random(symbols);
          }
          
          if (cell.isNeonBg) {
            if (d < scl * 3) {
              fill(0); rect(x, y, scl, scl);
              fill('#ccff00'); text(cell.char, x + scl/2, y + scl/2);
            } else {
              fill('#ccff00'); rect(x, y, scl, scl);
              fill(0); text(cell.char, x + scl/2, y + scl/2);
            }
          } else {
            if (d < scl * 3) {
              fill('#ccff00'); rect(x, y, scl, scl);
              fill(0); text(cell.char, x + scl/2, y + scl/2);
            } else {
              fill('#ccff00'); text(cell.char, x + scl/2, y + scl/2);
            }
          }
        }
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      cols = ceil(width / scl);
      rows = ceil(height / scl);
      setup();
    }
  </script>
</body>
</html>
