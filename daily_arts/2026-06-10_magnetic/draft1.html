<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flux - Magnetic Crowd</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;900&display=swap');
    body { margin: 0; background: #050507; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
    canvas { position: absolute; top: 0; left: 0; z-index: 1; }
    .content { position: absolute; top: 12vh; left: 6vw; z-index: 2; width: 35vw; pointer-events: none; }
    h1 { font-size: 8vw; font-weight: 900; line-height: 0.85; margin: 0 0 20px 0; letter-spacing: -0.05em; color: #ffffff; text-transform: uppercase; }
    h2 { font-size: 1.2vw; font-weight: 300; letter-spacing: 0.3em; color: #ccff00; margin: 0 0 30px 0; text-transform: uppercase; }
    p { font-size: 1vw; font-weight: 300; line-height: 1.6; color: rgba(255,255,255,0.5); max-width: 25vw; margin-top: 5vh; }
    .line { width: 40px; height: 2px; background: #ccff00; margin-bottom: 30px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
</head>
<body>
  <div class="content">
    <h2>System No. 01</h2>
    <div class="line"></div>
    <h1>MAGNETIC<br>FLUX</h1>
    <p>A dynamic simulation of swarm intelligence and gravitational pull. The nodes exist within a constrained flow field, reacting to cursor mass. Drag to attract, Space for pulse.</p>
  </div>
  <script src="draft1.js"></script>
</body>
</html>
