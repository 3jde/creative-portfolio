<!DOCTYPE html>
<html>
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>body { margin: 0; padding: 0; overflow: hidden; background: #FFF; }</style>
</head>
<body>
  <script>
    let springs = [];
    function setup() {
      createCanvas(windowWidth, windowHeight);
      for(let i=0; i<30; i++) {
        springs.push(new Spring(random(width), random(height)));
      }
    }
    function draw() {
      background(255, 50);
      for(let s of springs) {
        s.update();
        s.display();
      }
    }
    class Spring {
      constructor(x, y) {
        this.baseX = x; this.baseY = y;
        this.x = x; this.y = y;
        this.vx = 0; this.vy = 0;
      }
      update() {
        let dx = mouseX - this.x;
        let dy = mouseY - this.y;
        let d = dist(mouseX, mouseY, this.x, this.y);
        if (d < 100) {
          this.vx -= dx * 0.05;
          this.vy -= dy * 0.05;
        }
        let forceX = (this.baseX - this.x) * 0.1;
        let forceY = (this.baseY - this.y) * 0.1;
        this.vx = (this.vx + forceX) * 0.8;
        this.vy = (this.vy + forceY) * 0.8;
        this.x += this.vx;
        this.y += this.vy;
      }
      display() {
        stroke(0); strokeWeight(2);
        line(this.baseX, this.baseY, this.x, this.y);
        fill(255, 0, 50); noStroke();
        ellipse(this.x, this.y, 10, 10);
      }
    }
  </script>
</body>
</html>
