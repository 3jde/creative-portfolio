<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sketch A: 3D Cellular Automata</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>body { margin: 0; padding: 0; overflow: hidden; background: #0b0c10; }</style>
</head>
<body>
  <script>
    let cols, rows;
    let grid, next;
    let res = 20;
    
    function setup() {
      createCanvas(windowWidth, windowHeight, WEBGL);
      cols = floor(width / res / 1.5);
      rows = floor(height / res / 1.5);
      grid = make2DArray(cols, rows);
      next = make2DArray(cols, rows);
      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
          grid[i][j] = floor(random(2));
        }
      }
      frameRate(10);
    }

    function make2DArray(cols, rows) {
      let arr = new Array(cols);
      for (let i = 0; i < arr.length; i++) {
        arr[i] = new Array(rows);
      }
      return arr;
    }

    function draw() {
      background('#0b0c10');
      rotateX(PI / 3);
      translate(-cols * res / 2, -rows * res / 2, -50);
      
      ambientLight(50);
      directionalLight(0, 255, 200, 0.5, 0.5, -1);
      directionalLight(255, 0, 150, -0.5, -0.5, -1);
      
      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
          let x = i * res;
          let y = j * res;
          if (grid[i][j] == 1) {
            push();
            translate(x, y, 0);
            noStroke();
            let d = dist(i, j, cols/2, rows/2);
            ambientMaterial(255);
            box(res - 2, res - 2, map(d, 0, cols, 150, 10));
            pop();
          }
        }
      }

      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
          let state = grid[i][j];
          let neighbors = countNeighbors(grid, i, j);
          if (state == 0 && neighbors == 3) {
            next[i][j] = 1;
          } else if (state == 1 && (neighbors < 2 || neighbors > 3)) {
            next[i][j] = 0;
          } else {
            next[i][j] = state;
          }
        }
      }
      let temp = grid;
      grid = next;
      next = temp;
    }

    function countNeighbors(grid, x, y) {
      let sum = 0;
      for (let i = -1; i < 2; i++) {
        for (let j = -1; j < 2; j++) {
          let col = (x + i + cols) % cols;
          let row = (y + j + rows) % rows;
          sum += grid[col][row];
        }
      }
      sum -= grid[x][y];
      return sum;
    }
  </script>
</body>
</html>
