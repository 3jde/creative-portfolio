<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sketch A: Clifford Attractor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>body { margin: 0; padding: 0; overflow: hidden; background: #050505; }</style>
</head>
<body>
  <script>
    let x = 0.1, y = 0.1;
    let a = -1.4, b = 1.6, c = 1.0, d = 0.7;
    let points = [];
    
    function setup() {
      createCanvas(windowWidth, windowHeight);
      background(5);
      stroke(255, 50, 150, 30);
      strokeWeight(0.5);
    }

    function draw() {
      translate(width / 2, height / 2);
      
      // evolve parameters slightly over time for animation
      a = -1.4 + sin(frameCount * 0.001) * 0.2;
      b = 1.6 + cos(frameCount * 0.001) * 0.2;
      
      for (let i = 0; i < 1000; i++) {
        let xn = sin(a * y) + c * cos(a * x);
        let yn = sin(b * x) + d * cos(b * y);
        
        let px = map(x, -2.5, 2.5, -min(width, height)/2, min(width, height)/2);
        let py = map(y, -2.5, 2.5, -min(width, height)/2, min(width, height)/2);
        
        point(px, py);
        
        x = xn;
        y = yn;
      }
      
      // Fade out effect
      fill(5, 5, 5, 10);
      noStroke();
      rect(-width/2, -height/2, width, height);
      stroke(100, 200, 255, 30);
    }
  </script>
</body>
</html>
