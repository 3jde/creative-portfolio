<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sketch A: Monet's Flowing Lilies</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>body { margin: 0; padding: 0; overflow: hidden; background: #628395; }</style>
</head>
<body>
  <script>
    let pads = [];
    let t = 0;
    
    function setup() {
      createCanvas(windowWidth, windowHeight);
      for(let i=0; i<30; i++) {
        pads.push({
          x: random(width), y: random(height),
          r: random(20, 60),
          hueOffset: random(-20, 20),
          rot: random(TWO_PI)
        });
      }
      colorMode(HSB, 360, 100, 100, 1);
    }
    
    function draw() {
      background(200, 40, 50, 0.05); // slight trail
      noStroke();
      
      // Water ripple texture
      fill(210, 50, 80, 0.1);
      for(let i=0; i<20; i++) {
        let rx = noise(t + i)*width;
        let ry = noise(t + 100 + i)*height;
        ellipse(rx, ry, 100, 30);
      }
      
      for(let p of pads) {
        // Drifting in a flow field
        let angle = noise(p.x * 0.002, p.y * 0.002, t*0.2) * TWO_PI;
        p.x += cos(angle) * 0.5;
        p.y += sin(angle) * 0.5;
        
        // Interaction: move away from mouse
        let d = dist(mouseX, mouseY, p.x, p.y);
        if(d < 100) {
          p.x += (p.x - mouseX) * 0.05;
          p.y += (p.y - mouseY) * 0.05;
        }
        
        // Wrap around
        if(p.x > width+p.r) p.x = -p.r;
        if(p.x < -p.r) p.x = width+p.r;
        if(p.y > height+p.r) p.y = -p.r;
        if(p.y < -p.r) p.y = height+p.r;
        
        push();
        translate(p.x, p.y);
        rotate(p.rot + t*0.5);
        fill(130 + p.hueOffset, 60, 60, 0.9);
        arc(0, 0, p.r, p.r, 0, TWO_PI - PI/6, PIE); // Lily pad shape
        
        // Draw flower occasionally
        if (p.r > 40) {
          fill(330, 40, 90, 0.8);
          circle(0, 0, p.r*0.4);
          fill(60, 80, 90, 0.9);
          circle(0, 0, p.r*0.15);
        }
        pop();
      }
      t += 0.01;
    }
  </script>
</body>
</html>
