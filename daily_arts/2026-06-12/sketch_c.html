<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sketch C: Bauhaus Grid Rhythms</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>body { margin: 0; padding: 0; overflow: hidden; background: #efebe4; }</style>
</head>
<body>
  <script>
    let cols = ['#c83127', '#254a8b', '#e6af26', '#1a1b1d', '#efebe4'];
    let grid = [];
    let size = 50;
    function setup() {
      createCanvas(windowWidth, windowHeight);
      for(let x=0; x<width; x+=size) {
        for(let y=0; y<height; y+=size) {
          if(random(1) > 0.7) grid.push({x, y, w: random([1,2,3])*size, h: random([1,2,3])*size, c: random(cols)});
        }
      }
    }
    function draw() {
      background('#efebe4');
      stroke(20);
      strokeWeight(4);
      for(let g of grid) {
        fill(g.c);
        rect(g.x + sin(frameCount*0.02 + g.y)*5, g.y, g.w, g.h);
      }
    }
  </script>
</body>
</html>
