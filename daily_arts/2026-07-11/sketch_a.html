<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sketch A: Pollock's Drip Dynamics</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>body { margin: 0; padding: 0; overflow: hidden; background: #e6e3dc; }</style>
</head>
<body>
  <script>
    let drips = [];
    let palette = ['#1a1a1a', '#f5e9da', '#c43a3a', '#d4a34e', '#5a7c85'];
    
    function setup() {
      createCanvas(windowWidth, windowHeight);
      background('#e6e3dc'); // canvas color
    }
    
    function draw() {
      // Create new drip when mouse moves
      if (movedX !== 0 || movedY !== 0) {
        if (random() > 0.4) {
          drips.push({
            x: mouseX,
            y: mouseY,
            vx: movedX * random(0.1, 0.5),
            vy: movedY * random(0.1, 0.5),
            c: random(palette),
            size: random(1, 10),
            splatter: random() > 0.8
          });
        }
      }
      
      for (let i = drips.length - 1; i >= 0; i--) {
        let d = drips[i];
        
        fill(d.c);
        noStroke();
        circle(d.x, d.y, d.size);
        
        if (d.splatter) {
          for (let j=0; j<3; j++) {
            fill(d.c);
            circle(d.x + random(-15, 15), d.y + random(-15, 15), random(1, 3));
          }
        }
        
        d.x += d.vx;
        d.y += d.vy;
        
        // gravity and friction
        d.vy += 0.5;
        d.vx *= 0.95;
        d.size *= 0.98;
        
        if (d.size < 0.5 || d.y > height + 50) {
          drips.splice(i, 1);
        }
      }
    }
  </script>
</body>
</html>
