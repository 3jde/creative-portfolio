<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Klimt's Gold - Visual Flow</title>
  <style>body { margin: 0; overflow: hidden; background-color: #0d0b0a; }</style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
</head>
<body>
<script>
let particles = [];
const numParticles = 2000;
function setup() {
  createCanvas(windowWidth, windowHeight);
  background('#0d0b0a');
  for (let i = 0; i < numParticles; i++) {
    particles.push(new Particle());
  }
}

function draw() {
  background(13, 11, 10, 20); // fading trail
  let n = noise(frameCount * 0.005);
  for (let p of particles) {
    p.update();
    p.display();
  }
}

class Particle {
  constructor() {
    this.pos = createVector(random(width), random(height));
    this.vel = createVector(0, 0);
    this.acc = createVector(0, 0);
    this.maxSpeed = random(1, 3);
    this.color = random() > 0.8 ? color(255, 215, 0) : (random() > 0.5 ? color(218, 165, 32) : color(184, 134, 11));
    this.size = random(1, 4);
  }

  update() {
    let angle = noise(this.pos.x * 0.002, this.pos.y * 0.002, frameCount * 0.001) * TWO_PI * 4;
    let force = p5.Vector.fromAngle(angle);
    this.acc.add(force);
    this.vel.add(this.acc);
    this.vel.limit(this.maxSpeed);
    this.pos.add(this.vel);
    this.acc.mult(0);

    if (this.pos.x > width) this.pos.x = 0;
    if (this.pos.x < 0) this.pos.x = width;
    if (this.pos.y > height) this.pos.y = 0;
    if (this.pos.y < 0) this.pos.y = height;
  }

  display() {
    noStroke();
    fill(this.color.levels[0], this.color.levels[1], this.color.levels[2], 150);
    ellipse(this.pos.x, this.pos.y, this.size);
  }
}
function windowResized() { resizeCanvas(windowWidth, windowHeight); }
</script>
</body>
</html>
