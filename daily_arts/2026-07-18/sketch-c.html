<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sketch C: Digital Pointillism (Artistic Quality)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #fff; }
    canvas { display: block; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
</head>
<body>
<script>
// Sketch C: Generative interpretation of Seurat's Pointillism
// Focus: Millions of tiny dots forming an image, scattering on hover
let dots = [];
let imgCols = ['#5a7247', '#7b9d62', '#e4d3a0', '#9c6b45', '#457a8b'];

function setup() {
  createCanvas(windowWidth, windowHeight);
  // Grid of dots
  let spacing = 8;
  for(let x=0; x<width; x+=spacing) {
    for(let y=0; y<height; y+=spacing) {
      // Pick color based on spatial location (fake landscape)
      let colIndex = 0;
      if (y < height * 0.4) colIndex = 4; // Sky
      else if (y > height * 0.7) colIndex = 0; // Grass
      else colIndex = int(random(1, 4)); // Mixed middle
      
      dots.push({
        baseX: x + random(-2, 2),
        baseY: y + random(-2, 2),
        x: x, y: y,
        col: color(imgCols[colIndex])
      });
    }
  }
  noStroke();
}

function draw() {
  background(255);
  
  for(let d of dots) {
    let distToMouse = dist(mouseX, mouseY, d.baseX, d.baseY);
    if(distToMouse < 100) {
      // Scatter
      let angle = atan2(d.baseY - mouseY, d.baseX - mouseX);
      d.x = d.baseX + cos(angle) * (100 - distToMouse);
      d.y = d.baseY + sin(angle) * (100 - distToMouse);
    } else {
      // Return
      d.x = lerp(d.x, d.baseX, 0.1);
      d.y = lerp(d.y, d.baseY, 0.1);
    }
    
    fill(d.col);
    circle(d.x, d.y, 4);
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  // Skipped re-init for brevity
}
</script>
</body>
</html>
