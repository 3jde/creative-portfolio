<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sketch A: Haeckel's Bioluminescence</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>body { margin: 0; padding: 0; overflow: hidden; background: #050510; }</style>
</head>
<body>
  <script>
    let t = 0;
    function setup() {
      createCanvas(windowWidth, windowHeight);
      background(5, 5, 16);
      colorMode(HSB, 360, 100, 100, 1);
    }
    function draw() {
      background(5, 5, 16, 0.1);
      translate(width/2, height/2);
      strokeWeight(2);
      for(let i = 0; i < 6; i++) {
        push();
        rotate(TWO_PI * i / 6 + t * 0.005);
        let r = map(noise(t * 0.01 + i), 0, 1, 50, min(width, height) * 0.4);
        let x = r * cos(t * 0.02);
        let y = r * sin(t * 0.02);
        stroke((t + i * 20) % 360, 80, 100, 0.8);
        noFill();
        bezier(0, 0, x/2, y, x, y/2, x, y);
        fill((t + i * 20 + 180) % 360, 80, 100);
        noStroke();
        circle(x, y, 5);
        pop();
      }
      t += 2;
    }
  </script>
</body>
</html>
